<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Jumps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      user-select: none;
      overflow: hidden;
    }
    canvas {
      display: block;
      border: 2px solid #2a2a4a;
      box-shadow: 0 0 40px rgba(78, 204, 163, 0.15);
    }
    #hint {
      color: #555;
      font-size: 13px;
      margin-top: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">HOLD SPACE to charge · RELEASE to jump</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const W = 800, H = 380;
const GRAVITY        = 0.45;
const PLAYER_W       = 32, PLAYER_H = 32;
const PLAT_H         = 14;
const PLAYER_ANCHOR_X = 180;   // x position player returns to after scroll
const TARGET_JUMPS   = 100;
const MAX_CHARGE_MS  = 1800;   // ms to fill bar completely

// Platform difficulty scaling
const BASE_GAP   = 100;
const BASE_WIDTH = 160;
const GAP_GROW   = 1.2;        // gap grows this much per jump
const WIDTH_SHRINK = 0.7;      // platform shrinks this much per jump
const MIN_WIDTH  = 55;
const MAX_GAP    = 280;

// ─── State ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
canvas.width  = W;
canvas.height = H;

let state;     // 'idle' | 'charging' | 'jumping' | 'scrolling' | 'dead' | 'win'
let player;
let platforms;
let charge;          // 0..1
let chargeStart;     // timestamp when space pressed
let score;
let scrollLeft;      // remaining pixels to scroll
let spaceHeld;
let particles;
let shakeAmt;
let bestScore = 0;

// ─── Init ─────────────────────────────────────────────────────────────────────
function reset() {
  state       = 'idle';
  charge      = 0;
  chargeStart = 0;
  score       = 0;
  scrollLeft  = 0;
  spaceHeld   = false;
  particles   = [];
  shakeAmt    = 0;

  // Starting platform: wide, at fixed position
  const startPlat = { x: 60, y: 290, w: 220, h: PLAT_H };
  platforms = [startPlat];

  // Pre-generate several platforms ahead
  for (let i = 0; i < 6; i++) addNextPlatform();

  player = {
    x: startPlat.x + 50,
    y: startPlat.y - PLAYER_H,
    vx: 0,
    vy: 0,
  };
}

function platWidth(jumpIndex) {
  return Math.max(MIN_WIDTH, BASE_WIDTH - jumpIndex * WIDTH_SHRINK);
}
function platGap(jumpIndex) {
  return Math.min(MAX_GAP, BASE_GAP + jumpIndex * GAP_GROW);
}

function addNextPlatform() {
  const last  = platforms[platforms.length - 1];
  const idx   = platforms.length - 1;        // how many jumps in roughly
  const gap   = platGap(Math.min(idx, score + idx));
  const w     = platWidth(Math.min(idx, score + idx));
  const dy    = (Math.random() - 0.5) * 90; // vertical variation
  const y     = Math.max(160, Math.min(310, last.y + dy));
  platforms.push({ x: last.x + last.w + gap, y, w, h: PLAT_H });
}

// ─── Input ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();

  if (state === 'dead' || state === 'win') { reset(); return; }
  if (state === 'idle' && !spaceHeld) {
    state      = 'charging';
    chargeStart = performance.now();
    spaceHeld  = true;
  }
});

document.addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  spaceHeld = false;

  if (state === 'charging') {
    const power = Math.max(0.05, charge); // at least a tiny jump
    // Scale velocities: low charge = small hop, full charge = big leap
    player.vx = 2.5 + power * 9.5;
    player.vy = -(3.5 + power * 11.5);
    state = 'jumping';
    charge = 0;
  }
});

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnLandParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.PI + (Math.random() - 0.5) * Math.PI;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1,
      decay: 0.04 + Math.random() * 0.04,
      size: 2 + Math.random() * 4,
      color: `hsl(${160 + Math.random() * 40}, 70%, 60%)`
    });
  }
}

function updateParticles() {
  for (let p of particles) {
    p.x   += p.vx;
    p.y   += p.vy;
    p.vy  += 0.15;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update(now) {
  // Update charge bar
  if (state === 'charging') {
    charge = Math.min((now - chargeStart) / MAX_CHARGE_MS, 1);
  }

  // Physics
  if (state === 'jumping') {
    player.vy += GRAVITY;
    player.x  += player.vx;
    player.y  += player.vy;

    // Platform collision (only when falling)
    if (player.vy > 0) {
      for (const p of platforms) {
        const bottom = player.y + PLAYER_H;
        const prevBottom = bottom - player.vy;
        if (
          player.x + PLAYER_W > p.x + 4 &&
          player.x < p.x + p.w - 4 &&
          prevBottom <= p.y + 2 &&
          bottom >= p.y
        ) {
          // Landed!
          player.y = p.y - PLAYER_H;
          player.vx = 0;
          player.vy = 0;
          score++;
          spawnLandParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H);
          shakeAmt = 4;

          if (score >= TARGET_JUMPS) {
            state = 'win';
          } else {
            // How far to scroll: bring player back to anchor x
            scrollLeft = player.x - PLAYER_ANCHOR_X;
            state = 'scrolling';
            // Keep enough platforms ahead
            while (platforms.length < 8) addNextPlatform();
          }
          break;
        }
      }
    }

    // Death: fell below screen or went past right edge
    if (player.y > H + 80 || player.x > W + 60) {
      state = 'dead';
      if (score > bestScore) bestScore = score;
    }
  }

  // Scrolling
  if (state === 'scrolling') {
    const step = Math.min(scrollLeft, 10 + scrollLeft * 0.12);
    scrollLeft -= step;
    player.x   -= step;
    for (const p of platforms) p.x -= step;

    // Cull off-screen platforms
    if (platforms[0].x + platforms[0].w < -30) platforms.shift();
    // Ensure lookahead
    while (platforms.length < 8) addNextPlatform();

    if (scrollLeft <= 0.5) {
      scrollLeft = 0;
      state = 'idle';
    }
  }

  // Screen shake decay
  if (shakeAmt > 0) shakeAmt *= 0.75;

  updateParticles();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function drawBackground() {
  // Gradient sky
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0f1a');
  grad.addColorStop(1, '#1a1a35');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(p.x + 4, p.y + 6, p.w, p.h);

    // Body gradient
    const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    g.addColorStop(0, '#4ecca3');
    g.addColorStop(1, '#2a8a73');
    ctx.fillStyle = g;
    ctx.fillRect(p.x, p.y, p.w, p.h);

    // Top shine
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(p.x + 2, p.y + 1, p.w - 4, 3);
  }
}

function drawPlayer() {
  const px = Math.round(player.x);
  const py = Math.round(player.y);

  // Shadow on ground when jumping
  if (state === 'jumping') {
    const landPlat = platforms.find(p =>
      player.x + PLAYER_W > p.x && player.x < p.x + p.w
    );
    if (landPlat) {
      const dist = landPlat.y - (py + PLAYER_H);
      const alpha = Math.max(0, 0.4 - dist / 200);
      const scaleX = 1 - dist / 400;
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      const sw = PLAYER_W * scaleX;
      ctx.fillRect(player.x + (PLAYER_W - sw) / 2, landPlat.y - 3, sw, 4);
    }
  }

  // Body
  const bodyColor = state === 'dead' ? '#e74c3c' : '#e67e22';
  ctx.fillStyle = bodyColor;
  ctx.fillRect(px, py, PLAYER_W, PLAYER_H);

  // Face highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(px + 2, py + 2, PLAYER_W - 4, 8);

  // Eyes (tilt with velocity)
  const eyeOffY = state === 'jumping' ? Math.sign(player.vy) * 2 : 0;
  ctx.fillStyle = 'white';
  ctx.fillRect(px + 6,  py + 8 + eyeOffY, 7, 7);
  ctx.fillRect(px + 19, py + 8 + eyeOffY, 7, 7);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(px + 8,  py + 10 + eyeOffY, 4, 4);
  ctx.fillRect(px + 21, py + 10 + eyeOffY, 4, 4);

  // Squish/stretch based on vy
  if (state === 'jumping') {
    // Expression: scared eyes when falling fast
    if (player.vy > 6) {
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(px + 6,  py + 8 + eyeOffY, 7, 7);
      ctx.fillRect(px + 19, py + 8 + eyeOffY, 7, 7);
      ctx.fillStyle = 'black';
      ctx.fillRect(px + 9,  py + 10 + eyeOffY, 4, 4);
      ctx.fillRect(px + 22, py + 10 + eyeOffY, 4, 4);
    }
  }
}

function drawChargeBar() {
  if (state !== 'charging') return;

  const bw  = 64, bh = 10;
  const bx  = player.x + PLAYER_W / 2 - bw / 2;
  const by  = player.y - 22;

  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);

  // Fill color: green → yellow → red
  let r, g;
  if (charge < 0.5) {
    r = Math.floor(charge * 2 * 255);
    g = 200;
  } else {
    r = 255;
    g = Math.floor((1 - (charge - 0.5) * 2) * 200);
  }
  ctx.fillStyle = `rgb(${r},${g},50)`;
  ctx.fillRect(bx, by, bw * charge, bh);

  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);

  // Tick marks at 25%, 50%, 75%
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (const t of [0.25, 0.5, 0.75]) {
    ctx.fillRect(bx + bw * t - 0.5, by + 2, 1, bh - 4);
  }
}

function drawTrajectoryHint() {
  if (state !== 'charging' || charge < 0.1) return;

  const power = charge;
  const vx = 2.5 + power * 9.5;
  const vy = -(3.5 + power * 11.5);
  let x = player.x + PLAYER_W / 2, y = player.y + PLAYER_H / 2;
  let dvx = vx, dvy = vy;

  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 0; i < 40; i++) {
    dvy += GRAVITY;
    x += dvx;
    y += dvy;
    if (y > H) break;
    ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  // Jump counter
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(12, 12, 170, 36);
  ctx.fillStyle = '#4ecca3';
  ctx.font = 'bold 20px "Courier New"';
  ctx.fillText(`JUMPS  ${String(score).padStart(3,'0')} / ${TARGET_JUMPS}`, 22, 36);

  // Progress bar
  const pw = 170, ph = 5;
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(12, 52, pw, ph);
  ctx.fillStyle = '#4ecca3';
  ctx.fillRect(12, 52, pw * (score / TARGET_JUMPS), ph);

  // Best
  if (bestScore > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '12px "Courier New"';
    ctx.fillText(`BEST: ${bestScore}`, 14, 74);
  }

  // Idle hint
  if (state === 'idle' && score === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '14px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText('Hold SPACE to charge power, release to jump →', W / 2, H - 18);
    ctx.textAlign = 'left';
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawOverlay() {
  if (state !== 'dead' && state !== 'win') return;

  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  if (state === 'dead') {
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 52px "Courier New"';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);

    ctx.fillStyle = 'white';
    ctx.font = '22px "Courier New"';
    ctx.fillText(`You completed ${score} jump${score !== 1 ? 's' : ''}`, W / 2, H / 2 + 18);

    if (score === bestScore && score > 0) {
      ctx.fillStyle = '#f1c40f';
      ctx.font = '16px "Courier New"';
      ctx.fillText('NEW BEST!', W / 2, H / 2 + 48);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '15px "Courier New"';
    ctx.fillText('Press SPACE to try again', W / 2, H / 2 + 80);
  }

  if (state === 'win') {
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 52px "Courier New"';
    ctx.fillText('YOU WIN!', W / 2, H / 2 - 30);

    ctx.fillStyle = 'white';
    ctx.font = '22px "Courier New"';
    ctx.fillText('100 jumps completed!', W / 2, H / 2 + 18);

    ctx.fillStyle = '#4ecca3';
    ctx.font = '16px "Courier New"';
    ctx.fillText('Press SPACE to play again', W / 2, H / 2 + 60);
  }

  ctx.textAlign = 'left';
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(now) {
  update(now);

  // Screen shake
  const sx = shakeAmt > 0.5 ? (Math.random() - 0.5) * shakeAmt * 2 : 0;
  const sy = shakeAmt > 0.5 ? (Math.random() - 0.5) * shakeAmt * 2 : 0;

  ctx.save();
  if (sx || sy) ctx.translate(sx, sy);

  drawBackground();
  drawPlatforms();
  drawParticles();
  drawTrajectoryHint();
  drawChargeBar();
  drawPlayer();
  drawHUD();
  drawOverlay();

  ctx.restore();

  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
