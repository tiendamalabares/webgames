<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Jumps Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05050f;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Space Grotesk', 'Courier New', monospace;
      touch-action: none;
    }

    #wrap {
      position: relative;
      /* scaled via JS to fit viewport */
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* Mobile tap overlay */
    #tap {
      position: absolute;
      inset: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Settings panel ── */
    #cfg-btn {
      position: fixed;
      top: 10px; right: 10px;
      z-index: 200;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(100,136,255,0.25);
      border: 1px solid rgba(100,136,255,0.5);
      color: #aac0ff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      touch-action: auto;
      transition: background 0.15s;
    }
    #cfg-btn:hover { background: rgba(100,136,255,0.45); }

    #cfg-panel {
      position: fixed;
      top: 0; right: -260px;
      width: 250px; height: 100vh;
      background: rgba(4,4,18,0.97);
      border-left: 1px solid rgba(100,136,255,0.25);
      padding: 52px 16px 20px;
      z-index: 199;
      transition: right 0.2s ease;
      touch-action: auto;
      overflow-y: auto;
      font-family: 'Space Grotesk', monospace;
      color: #c8d8ff;
      font-size: 12px;
    }
    #cfg-panel.open { right: 0; }

    #cfg-panel h3 {
      font-size: 13px;
      font-weight: 700;
      color: #6488ff;
      letter-spacing: .08em;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .cfg-row {
      margin-bottom: 16px;
    }
    .cfg-row label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: rgba(200,216,255,0.75);
    }
    .cfg-row label span {
      color: #fff;
      font-weight: 700;
      min-width: 40px;
      text-align: right;
    }
    .cfg-row input[type=range] {
      width: 100%;
      accent-color: #6488ff;
      cursor: pointer;
    }

    .cfg-reset {
      margin-top: 20px;
      width: 100%;
      padding: 8px;
      background: rgba(100,136,255,0.15);
      border: 1px solid rgba(100,136,255,0.4);
      border-radius: 6px;
      color: #aac0ff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: auto;
    }
    .cfg-reset:hover { background: rgba(100,136,255,0.3); }
  </style>
</head>
<body>

<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="tap"></div>
</div>

<button id="cfg-btn" title="Ajustes">⚙</button>

<div id="cfg-panel">
  <h3>Ajustes</h3>

  <div class="cfg-row">
    <label>Velocidad carga <span id="v-charge">800</span>ms</label>
    <input type="range" id="sl-charge" min="200" max="2000" step="50" value="800">
  </div>
  <div class="cfg-row">
    <label>Alcance horiz. <span id="v-vx">3.5</span></label>
    <input type="range" id="sl-vx" min="1" max="7" step="0.1" value="3.5">
  </div>
  <div class="cfg-row">
    <label>Altura salto <span id="v-gap">150</span>px</label>
    <input type="range" id="sl-gap" min="60" max="300" step="10" value="150">
  </div>
  <div class="cfg-row">
    <label>Gravedad <span id="v-grav">0.75</span></label>
    <input type="range" id="sl-grav" min="0.2" max="2" step="0.05" value="0.75">
  </div>
  <div class="cfg-row">
    <label>Ancho inicial <span id="v-wbase">80</span>px</label>
    <input type="range" id="sl-wbase" min="10" max="180" step="5" value="80">
  </div>
  <div class="cfg-row">
    <label>Ancho mínimo <span id="v-wmin">10</span>px</label>
    <input type="range" id="sl-wmin" min="4" max="80" step="2" value="10">
  </div>
  <div class="cfg-row">
    <label>Reduc. ancho/salto <span id="v-wshrink">0.75</span></label>
    <input type="range" id="sl-wshrink" min="0" max="3" step="0.05" value="0.75">
  </div>

  <div class="cfg-row" style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
    <label style="margin:0">Línea trayectoria</label>
    <input type="checkbox" id="sl-traj" style="width:18px;height:18px;accent-color:#6488ff;cursor:pointer;touch-action:auto">
  </div>

  <button class="cfg-reset" id="cfg-reset-btn">↺ Valores por defecto</button>
</div>

<script>
// ─── Canvas & scaling ────────────────────────────────────────────────────────
const CW = 420, CH = 640;  // logical resolution
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('wrap');
canvas.width  = CW;
canvas.height = CH;

function resize() {
  const scale = Math.min(window.innerWidth / CW, window.innerHeight / CH, 2);
  wrap.style.width  = `${CW * scale}px`;
  wrap.style.height = `${CH * scale}px`;
  canvas.style.width  = `${CW * scale}px`;
  canvas.style.height = `${CH * scale}px`;
}
window.addEventListener('resize', resize);
resize();

// ─── Constants ───────────────────────────────────────────────────────────────
const W = CW, H = CH;
const PLAYER_SIZE   = 28;
const PLAT_H        = 14;
const TARGET_JUMPS  = 100;
const CAM_PLAYER_Y  = H * 0.65;

// Tweakable via sliders
let GRAVITY       = 0.75;
let MAX_CHARGE_MS = 800;
let VERT_GAP      = 150;
let WIDTH_BASE    = 80;
let WIDTH_SHRINK  = 0.75;
let WIDTH_MIN     = 10;
let MAX_VX        = 3.5;
let SHOW_TRAJ     = false;          // trajectory line off by default

// ─── State ───────────────────────────────────────────────────────────────────
// states: 'intro' | 'idle' | 'charging' | 'jumping' | 'dead' | 'win'
let state, player, platforms, score, charge, chargeStart;
let spaceHeld, cameraY, particles, shakeAmt, bestScore = 0;
let introAnim = 0; // for intro screen animation
let nextPlatDir = 1; // alternates ±1 independently of array length

// ─── Helpers ─────────────────────────────────────────────────────────────────
const platWidth  = i => Math.max(WIDTH_MIN,  WIDTH_BASE  - i * WIDTH_SHRINK);
const wy         = worldY => worldY - cameraY;
const lerp       = (a, b, t) => a + (b - a) * t;

function rand(min, max) { return min + Math.random() * (max - min); }

// ─── Platform generation ─────────────────────────────────────────────────────
function addNextPlatform() {
  const last    = platforms[platforms.length - 1];
  const idx     = platforms.length;
  const safeIdx = Math.min(idx + score, 85);
  const w       = platWidth(safeIdx);
  const minCx   = w / 2 + 18;
  const maxCx   = W - w / 2 - 18;
  const lastCx  = last.x + last.w / 2;

  // Choose direction that has room; prefer alternating
  let dir = nextPlatDir;
  const roomDir  = dir === 1 ? maxCx - lastCx : lastCx - minCx;
  if (roomDir < 15) dir = -dir; // flip if no room
  nextPlatDir = -dir;

  // Random offset always within reachable range [15, 82] and within screen
  const maxOff = Math.min(112, dir === 1 ? maxCx - lastCx : lastCx - minCx);
  const offset  = rand(5, Math.max(5, maxOff));
  let newCx     = lastCx + dir * offset;
  newCx = Math.max(minCx, Math.min(maxCx, newCx));
  // Gap varies widely around base value: 30%–140% of VERT_GAP
  const vertGap = VERT_GAP * rand(0.3, 1.4);
  platforms.push({ x: newCx - w / 2, y: last.y - vertGap, w, h: PLAT_H, dir });
}

// ─── Reset / init ────────────────────────────────────────────────────────────
function reset() {
  state      = 'idle';
  charge     = 0;
  chargeStart = 0;
  spaceHeld  = false;
  score      = 0;
  particles  = [];
  shakeAmt   = 0;

  const startW = 180, startX = W / 2 - 90, startY = 1400;
  nextPlatDir = 1;
  platforms = [{ x: startX, y: startY, w: startW, h: PLAT_H, dir: null }];
  for (let i = 0; i < 2; i++) addNextPlatform();

  // player.y = hand position (top of character, grabs platform bottom)
  player  = { x: W / 2 - PLAYER_SIZE / 2, y: startY + PLAT_H, vx: 0, vy: 0, grabDir: 1 };
  cameraY = player.y - CAM_PLAYER_Y;
}

// ─── Input ───────────────────────────────────────────────────────────────────
function onPress() {
  if (state === 'intro')            { reset(); return; }
  if (state === 'dead' || state === 'win') { reset(); return; }
  if (state === 'idle' && !spaceHeld) {
    state       = 'charging';
    chargeStart = performance.now();
    spaceHeld   = true;
  }
}

function onRelease() {
  spaceHeld = false;
  if (state !== 'charging') return;

  const next    = getNextPlatform();
  const dir     = next ? next.dir : 1;
  player.vx     = dir * charge * MAX_VX;
  player.vy     = -(10 + charge * 9);  // charge controls height too
  state         = 'jumping';
  charge        = 0;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); onPress(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') onRelease();
});

// Touch / click
const tapEl = document.getElementById('tap');
tapEl.addEventListener('pointerdown', e => { e.preventDefault(); onPress(); });
tapEl.addEventListener('pointerup',   e => { e.preventDefault(); onRelease(); });

// ─── Game logic ───────────────────────────────────────────────────────────────
function getNextPlatform() {
  // Next platform is above the hand (p.y + PLAT_H < player.y means bottom above hand)
  return platforms.find(p => p.dir !== null && p.y + PLAT_H < player.y - 5);
}

function spawnParticles(x, y) {
  for (let i = 0; i < 16; i++) {
    const angle = Math.PI + rand(-0.6, 0.6) * Math.PI;
    const speed = rand(1, 4);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      life: 1,
      decay: rand(0.03, 0.06),
      size: rand(2, 5),
      hue: rand(210, 270),
    });
  }
}

function update(now) {
  if (state === 'intro') {
    introAnim = now;
    return;
  }

  if (state === 'charging') {
    charge = Math.min((now - chargeStart) / MAX_CHARGE_MS, 1);
  }

  if (state === 'jumping') {
    player.vy += GRAVITY;
    player.x  += player.vx;
    player.y  += player.vy;

    if (player.vy < 0) {  // grabbing while going UP
      for (const p of platforms) {
        if (p.dir === null) continue;
        const handY     = player.y;
        const prevHandY = handY - player.vy;  // was lower (vy<0 → prev was higher y)
        if (
          player.x + PLAYER_SIZE > p.x + 3 &&
          player.x               < p.x + p.w - 3 &&
          prevHandY >= p.y + PLAT_H &&
          handY     <= p.y + PLAT_H + 4
        ) {
          player.y  = p.y + PLAT_H;  // hand snaps to platform bottom
          player.vx = 0; player.vy = 0;
          player.grabDir = -player.grabDir;  // alternate hand
          score++;
          spawnParticles(player.x + PLAYER_SIZE / 2, p.y + PLAT_H);
          shakeAmt = 5;
          p.dir = null;

          if (score >= TARGET_JUMPS) {
            state = 'win';
            if (score > bestScore) bestScore = score;
          } else {
            state = 'idle';
            while (platforms.length < 3) addNextPlatform();
          }
          break;
        }
      }
    }

    if (player.y > cameraY + H + 140 ||
        player.x + PLAYER_SIZE < -30 ||
        player.x > W + 30) {
      if (score > bestScore) bestScore = score;
      state = 'dead';
    }
  }

  // Camera: follow player upward only
  const targetCam = player.y - CAM_PLAYER_Y;
  if (targetCam < cameraY) cameraY = lerp(cameraY, targetCam, 0.09);

  // Cull & generate
  platforms = platforms.filter(p => p.y < cameraY + H + 80);
  while (platforms.length < 3) addNextPlatform();

  // Particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12; p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);

  if (shakeAmt > 0) shakeAmt *= 0.7;
}

// ─── Draw helpers ────────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

// ─── Render ──────────────────────────────────────────────────────────────────
function drawBg() {
  // Deep space gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#05050f');
  grad.addColorStop(1, '#0d0d22');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Parallax stars — two layers
  const t = (state === 'intro') ? 0 : cameraY;
  for (let layer = 0; layer < 2; layer++) {
    const count  = layer === 0 ? 55 : 25;
    const speed  = layer === 0 ? 0.3 : 0.6;
    const alpha  = layer === 0 ? 0.35 : 0.7;
    const size   = layer === 0 ? 1 : 2;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    for (let i = 0; i < count; i++) {
      const sx = (i * 173.7 + layer * 300) % W;
      const sy = ((i * 113.1 + layer * 500 + t * speed) % (H * 3) + H * 3) % (H * 3) % H;
      ctx.fillRect(sx, sy, size, size);
    }
  }
}

function drawPlatforms() {
  const next = getNextPlatform();
  for (const p of platforms) {
    const sy = wy(p.y);
    if (sy > H + 40 || sy < -40) continue;

    const isActive = p.dir !== null;
    const isTarget = p === next;

    // Glow for target platform
    if (isTarget && (state === 'idle' || state === 'charging')) {
      const pulse = 0.4 + 0.3 * Math.sin(performance.now() / 400);
      ctx.shadowColor = '#6488ff';
      ctx.shadowBlur  = 14 * pulse;
    }

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(p.x + 4, sy + 6, p.w, p.h);

    // Body
    const g = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h);
    if (isActive) {
      g.addColorStop(0, isTarget ? '#7ba0ff' : '#5577ee');
      g.addColorStop(1, isTarget ? '#4466cc' : '#2a44aa');
    } else {
      g.addColorStop(0, '#2e2e4e');
      g.addColorStop(1, '#1a1a32');
    }
    ctx.fillStyle = g;
    ctx.fillRect(p.x, sy, p.w, p.h);

    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(p.x + 2, sy + 1, p.w - 4, 3);

    ctx.shadowBlur = 0;
  }
}

function drawTrajectory() {
  if (!SHOW_TRAJ || state !== 'charging') return;
  const next = getNextPlatform();
  if (!next) return;

  const dir = next.dir;
  const vx  = dir * charge * MAX_VX;      // same as onRelease
  const vy  = -(10 + charge * 9);         // same as onRelease
  let x = player.x + PLAYER_SIZE / 2;
  let y = player.y;                        // hand position (top of character)
  let dvx = vx, dvy = vy;
  let landX = x, landY = y;

  ctx.save();
  ctx.shadowColor = 'rgba(160,210,255,0.8)';
  ctx.shadowBlur  = 8;
  ctx.setLineDash([4, 7]);
  ctx.strokeStyle = `rgba(180,220,255,${0.4 + charge * 0.6})`;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x, wy(y));

  for (let i = 0; i < 200; i++) {
    const prevY = y;
    dvy += GRAVITY;
    x   += dvx;
    y   += dvy;
    // Stop when hand crosses next platform bottom (rising grab)
    if (dvy < 0 && prevY > next.y + PLAT_H && y <= next.y + PLAT_H) {
      // Interpolate landing x
      const frac = (next.y + PLAT_H - prevY) / (y - prevY);
      landX = x - dvx * (1 - frac);
      landY = next.y + PLAT_H;
      ctx.lineTo(landX, wy(landY));
      break;
    }
    landX = x; landY = y;
    if (wy(y) < -10) break;
    ctx.lineTo(x, wy(y));
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Landing dot on the platform level
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.arc(landX, wy(landY), 5, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(200,230,255,${0.6 + charge * 0.4})`;
  ctx.fill();

  ctx.restore();
}

function drawPlayer() {
  const cx  = Math.round(player.x + PLAYER_SIZE / 2);
  const gy  = Math.round(wy(player.y));   // hand / grab y on screen
  const gd  = player.grabDir || 1;        // which side the grabbing hand is on
  const isFlying  = state === 'jumping';
  const isFalling = isFlying && player.vy > 3;

  ctx.save();

  if (isFlying) {
    // ── Flying pose ──
    // Rotate body slightly by velocity angle
    const angle = Math.atan2(player.vy, player.vx) * 0.35;
    ctx.translate(cx, gy + 14);
    ctx.rotate(angle);

    // Legs kicked back
    ctx.strokeStyle = '#1a1050';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-3, 8); ctx.lineTo(-6, 18);
    ctx.moveTo( 3, 8); ctx.lineTo( 6, 18);
    ctx.stroke();

    // Body (shirt)
    ctx.fillStyle = isFalling ? '#cc3322' : '#2255cc';
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 10, 0, 0, Math.PI * 2); ctx.fill();

    // Head
    ctx.fillStyle = '#f4a66a';
    ctx.beginPath(); ctx.arc(0, -14, 8, 0, Math.PI * 2); ctx.fill();
    // Hair
    ctx.fillStyle = '#3a2010';
    ctx.beginPath(); ctx.arc(0, -17, 8, Math.PI, 0); ctx.fill();
    // Eyes — wide open
    ctx.fillStyle = 'white';
    ctx.fillRect(-5, -16, 4, 5); ctx.fillRect(2, -16, 4, 5);
    ctx.fillStyle = '#111';
    ctx.fillRect(isFalling ? -4 : -4, -15, 3, 3);
    ctx.fillRect(isFalling ?  3 :  3, -15, 3, 3);
    // Open mouth (surprise/effort)
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(0, -9, 2.5, 0, Math.PI * 2); ctx.fill();

    // Arms spread — one let go, one reaching
    const nextDir = player.vx > 0 ? 1 : -1;
    ctx.strokeStyle = '#f4a66a'; ctx.lineWidth = 3;
    // Let-go arm (side jumped from)
    ctx.beginPath();
    ctx.moveTo(-gd * 7, -5); ctx.lineTo(-gd * 18, -12); ctx.stroke();
    // Reaching arm (toward platform)
    ctx.beginPath();
    ctx.moveTo(gd * 7, -5); ctx.lineTo(gd * 20, -14); ctx.stroke();
    // Fist on reaching arm
    ctx.fillStyle = '#f4a66a';
    ctx.beginPath(); ctx.arc(gd * 20, -14, 3, 0, Math.PI * 2); ctx.fill();

  } else {
    // ── Hanging pose ──
    const handX = cx + gd * 5;
    const next  = getNextPlatform();
    const nd    = next ? next.dir : -gd;  // direction toward next platform

    // Grabbing arm (up to platform)
    ctx.strokeStyle = '#f4a66a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(handX, gy); ctx.lineTo(cx - gd * 2, gy + 12); ctx.stroke();
    // Fist on grip
    ctx.fillStyle = '#f4a66a';
    ctx.beginPath(); ctx.arc(handX, gy, 3.5, 0, Math.PI * 2); ctx.fill();

    // Free arm (points toward next platform, animated when charging)
    const armPulse = state === 'charging' ? Math.sin(performance.now() / 120) * 3 : 0;
    ctx.strokeStyle = '#f4a66a'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - gd * 2, gy + 12);
    ctx.lineTo(cx + nd * 15, gy + 8 + armPulse);
    ctx.stroke();
    ctx.fillStyle = '#f4a66a';
    ctx.beginPath(); ctx.arc(cx + nd * 15, gy + 8 + armPulse, 3, 0, Math.PI * 2); ctx.fill();

    // Head
    ctx.fillStyle = '#f4a66a';
    ctx.beginPath(); ctx.arc(cx, gy + 20, 8, 0, Math.PI * 2); ctx.fill();
    // Hair
    ctx.fillStyle = '#3a2010';
    ctx.beginPath(); ctx.arc(cx, gy + 16, 8, Math.PI, 0); ctx.fill();
    // Eyes
    const ey = gy + 19;
    ctx.fillStyle = 'white';
    ctx.fillRect(cx - 5, ey, 4, 4); ctx.fillRect(cx + 2, ey, 4, 4);
    ctx.fillStyle = '#111';
    ctx.fillRect(cx - 4, ey + 1, 2, 2); ctx.fillRect(cx + 3, ey + 1, 2, 2);
    // Expression
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (state === 'charging') {
      // Determined — straight line
      ctx.moveTo(cx - 3, ey + 6); ctx.lineTo(cx + 3, ey + 6);
    } else {
      // Relaxed smile
      ctx.arc(cx, ey + 4, 3, 0.1, Math.PI - 0.1);
    }
    ctx.stroke();

    // Body (shirt)
    ctx.fillStyle = '#2255cc';
    ctx.beginPath(); ctx.roundRect(cx - 6, gy + 28, 12, 9, 2); ctx.fill();
    // Pants
    ctx.fillStyle = '#1a1050';
    ctx.beginPath(); ctx.roundRect(cx - 5, gy + 36, 10, 7, 1); ctx.fill();
    // Legs dangling
    ctx.strokeStyle = '#1a1050'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 2, gy + 43); ctx.lineTo(cx - 5, gy + 53);
    ctx.moveTo(cx + 2, gy + 43); ctx.lineTo(cx + 5, gy + 53);
    ctx.stroke();
    // Shoes
    ctx.fillStyle = '#882222';
    ctx.fillRect(cx - 9, gy + 52, 7, 4);
    ctx.fillRect(cx + 2, gy + 52, 7, 4);
  }

  ctx.restore();
}

function drawChargeBar() {
  if (state !== 'charging') return;
  const bw = 64, bh = 11;
  const bx = player.x + PLAYER_SIZE / 2 - bw / 2;
  const by = wy(player.y) - 28;

  // Bg
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(bx - 2, by - 2, bw + 4, bh + 4, 4);

  // Fill
  let r, g;
  if (charge < 0.5) { r = Math.floor(charge * 2 * 255); g = 200; }
  else              { r = 255; g = Math.floor((1 - (charge - 0.5) * 2) * 200); }
  ctx.fillStyle = `rgb(${r},${g},50)`;
  if (charge > 0) roundRect(bx, by, bw * charge, bh, 3);

  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth   = 1;
  ctx.strokeRect(bx, by, bw, bh);

  // Ticks
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  for (const t of [1/3, 2/3]) ctx.fillRect(bx + bw * t, by + 2, 1, bh - 4);
}

function drawArrow() {
  if (state !== 'idle' && state !== 'charging') return;
  const next = getNextPlatform();
  if (!next) return;
  const dir   = next.dir;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 350);
  const ax    = dir === 1 ? player.x + PLAYER_SIZE + 10 : player.x - 10;
  const ay    = wy(player.y) + PLAYER_SIZE / 2 + 2;

  ctx.save();
  ctx.globalAlpha = 0.3 + pulse * 0.5;
  ctx.fillStyle   = '#aac0ff';
  ctx.font        = 'bold 20px "Space Grotesk", monospace';
  ctx.textAlign   = dir === 1 ? 'left' : 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(dir === 1 ? '▶' : '◀', ax, ay);
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = `hsl(${p.hue},70%,65%)`;
    ctx.fillRect(p.x - p.size / 2, wy(p.y) - p.size / 2, p.size, p.size);
  }
  ctx.restore();
}

function drawHUD() {
  // Top bar background
  ctx.fillStyle = 'rgba(5,5,20,0.8)';
  ctx.fillRect(0, 0, W, 58);

  // JUMPS label
  ctx.fillStyle = 'rgba(100,136,255,0.7)';
  ctx.font      = '11px "Space Grotesk", monospace';
  ctx.fillText('JUMPS', 16, 18);

  // Count
  ctx.fillStyle = 'white';
  ctx.font      = 'bold 26px "Space Grotesk", monospace';
  ctx.fillText(`${score}`, 16, 44);

  // /100
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font      = '14px "Space Grotesk", monospace';
  ctx.fillText(`/ ${TARGET_JUMPS}`, 16 + ctx.measureText(`${score}`).width + 5, 44);

  // Progress bar
  const bx = 16, by = 50, bw = W - 32, bh = 4;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(bx, by, bw, bh);
  const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  pg.addColorStop(0, '#5577ff');
  pg.addColorStop(1, '#88ffcc');
  ctx.fillStyle = pg;
  ctx.fillRect(bx, by, bw * (score / TARGET_JUMPS), bh);

  // Best score (top right)
  if (bestScore > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font      = '11px "Space Grotesk", monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`BEST  ${bestScore}`, W - 14, 18);
    ctx.textAlign = 'left';
  }

  // Jump direction label (bottom of screen)
  if (state === 'idle' || state === 'charging') {
    const next = getNextPlatform();
    if (next) {
      const lbl = next.dir === 1 ? '▶  JUMP RIGHT' : 'JUMP LEFT  ◀';
      ctx.fillStyle  = 'rgba(100,136,255,0.65)';
      ctx.font       = 'bold 12px "Space Grotesk", monospace';
      ctx.textAlign  = 'center';
      ctx.fillText(lbl, W / 2, H - 14);
      ctx.textAlign  = 'left';
    }
  }

  // First-run hint
  if (score === 0 && state === 'idle') {
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font      = '13px "Space Grotesk", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Hold SPACE to charge · release to jump', W / 2, H - 34);
    ctx.textAlign = 'left';
  }
}

// ─── Intro screen ────────────────────────────────────────────────────────────
function drawIntro(now) {
  drawBg();

  // Title
  const pulse = 0.92 + 0.08 * Math.sin(now / 600);
  ctx.save();
  ctx.translate(W / 2, H / 2 - 60);
  ctx.scale(pulse, pulse);

  // Big number
  ctx.fillStyle = '#6488ff';
  ctx.font      = 'bold 96px "Space Grotesk", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('100', 0, -30);

  ctx.fillStyle = 'white';
  ctx.font      = 'bold 36px "Space Grotesk", monospace';
  ctx.fillText('JUMPS UP', 0, 40);

  ctx.restore();

  // Animated mini player demo
  const demoX = W / 2 - 14;
  const demoY = H / 2 + 80 + Math.sin(now / 500) * 8;
  ctx.fillStyle = '#f0a030';
  ctx.fillRect(demoX, demoY, 28, 28);
  ctx.fillStyle = 'white';
  ctx.fillRect(demoX + 5,  demoY + 8,  7, 7);
  ctx.fillRect(demoX + 16, demoY + 8,  7, 7);
  ctx.fillStyle = '#111';
  ctx.fillRect(demoX + 7,  demoY + 10, 4, 4);
  ctx.fillRect(demoX + 18, demoY + 10, 4, 4);

  // Platform below demo player
  ctx.fillStyle = '#5577ee';
  ctx.fillRect(W / 2 - 60, H / 2 + 114, 120, 14);

  // Press to start
  const a = 0.5 + 0.5 * Math.sin(now / 500);
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.font      = 'bold 15px "Space Grotesk", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PRESS SPACE  or  TAP  to start', W / 2, H - 50);
  ctx.textAlign = 'left';

  // Best score
  if (bestScore > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font      = '13px "Space Grotesk", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Best: ${bestScore} jumps`, W / 2, H - 24);
    ctx.textAlign = 'left';
  }
}

// ─── Overlay (dead / win) ────────────────────────────────────────────────────
function drawOverlay() {
  if (state !== 'dead' && state !== 'win') return;

  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  if (state === 'dead') {
    ctx.fillStyle = '#e74c3c';
    ctx.font      = 'bold 52px "Space Grotesk", monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 44);

    ctx.fillStyle = 'white';
    ctx.font      = '22px "Space Grotesk", monospace';
    ctx.fillText(`${score} jump${score !== 1 ? 's' : ''} up`, W / 2, H / 2 + 10);

    if (score > 0 && score === bestScore) {
      ctx.fillStyle = '#f1c40f';
      ctx.font      = 'bold 16px "Space Grotesk", monospace';
      ctx.fillText('★  NEW BEST  ★', W / 2, H / 2 + 46);
    }

    const a = 0.4 + 0.3 * Math.sin(performance.now() / 500);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.font      = '14px "Space Grotesk", monospace';
    ctx.fillText('SPACE / TAP to try again', W / 2, H / 2 + 84);
  }

  if (state === 'win') {
    ctx.fillStyle = '#f1c40f';
    ctx.font      = 'bold 52px "Space Grotesk", monospace';
    ctx.fillText('YOU WIN!', W / 2, H / 2 - 44);

    ctx.fillStyle = 'white';
    ctx.font      = '20px "Space Grotesk", monospace';
    ctx.fillText('100 jumps reached!', W / 2, H / 2 + 8);

    ctx.fillStyle = '#88aaff';
    ctx.font      = '14px "Space Grotesk", monospace';
    ctx.fillText('SPACE / TAP to play again', W / 2, H / 2 + 52);
  }

  ctx.textAlign = 'left';
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(now) {
  update(now);

  if (state === 'intro') {
    drawIntro(now);
    requestAnimationFrame(loop);
    return;
  }

  // Screen shake
  const sx = shakeAmt > 0.5 ? rand(-shakeAmt, shakeAmt) : 0;
  const sy = shakeAmt > 0.5 ? rand(-shakeAmt, shakeAmt) : 0;
  ctx.save();
  if (sx || sy) ctx.translate(sx, sy);

  drawBg();
  drawPlatforms();
  drawParticles();
  drawTrajectory();
  drawArrow();
  drawChargeBar();
  drawPlayer();
  drawHUD();
  drawOverlay();

  ctx.restore();
  requestAnimationFrame(loop);
}

// ─── Boot ────────────────────────────────────────────────────────────────────
state = 'intro';
// Pre-build platforms so the intro has something ready
reset();
state = 'intro';
requestAnimationFrame(loop);

// ─── Settings panel ──────────────────────────────────────────────────────────
(function () {
  const DEFAULTS = {
    charge: 800, vx: 3.5, gap: 150, grav: 0.75,
    wbase: 80, wmin: 10, wshrink: 0.75
  };

  const btn   = document.getElementById('cfg-btn');
  const panel = document.getElementById('cfg-panel');

  btn.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.toggle('open');
  });
  // Close panel on tap outside
  document.addEventListener('pointerdown', e => {
    if (!panel.contains(e.target) && e.target !== btn)
      panel.classList.remove('open');
  });

  function bind(id, valId, apply, fmt) {
    const sl  = document.getElementById('sl-' + id);
    const lbl = document.getElementById('v-'  + id);
    sl.addEventListener('input', () => {
      const v = parseFloat(sl.value);
      lbl.textContent = fmt ? fmt(v) : v;
      apply(v);
    });
  }

  document.getElementById('sl-traj').addEventListener('change', e => {
    SHOW_TRAJ = e.target.checked;
  });

  bind('charge',  'charge',  v => { MAX_CHARGE_MS = v; },       v => v);
  bind('vx',      'vx',      v => { MAX_VX        = v; },       v => v.toFixed(1));
  bind('gap',     'gap',     v => { VERT_GAP      = v; },       v => v);
  bind('grav',    'grav',    v => { GRAVITY        = v; },       v => v.toFixed(2));
  bind('wbase',   'wbase',   v => { WIDTH_BASE     = v; },       v => v);
  bind('wmin',    'wmin',    v => { WIDTH_MIN      = v; },       v => v);
  bind('wshrink', 'wshrink', v => { WIDTH_SHRINK   = v; },       v => v.toFixed(2));

  document.getElementById('cfg-reset-btn').addEventListener('click', () => {
    MAX_CHARGE_MS = DEFAULTS.charge;
    MAX_VX        = DEFAULTS.vx;
    VERT_GAP      = DEFAULTS.gap;
    GRAVITY       = DEFAULTS.grav;
    WIDTH_BASE    = DEFAULTS.wbase;
    WIDTH_MIN     = DEFAULTS.wmin;
    WIDTH_SHRINK  = DEFAULTS.wshrink;
    // Sync slider positions
    document.getElementById('sl-charge').value  = DEFAULTS.charge;
    document.getElementById('sl-vx').value      = DEFAULTS.vx;
    document.getElementById('sl-gap').value     = DEFAULTS.gap;
    document.getElementById('sl-grav').value    = DEFAULTS.grav;
    document.getElementById('sl-wbase').value   = DEFAULTS.wbase;
    document.getElementById('sl-wmin').value    = DEFAULTS.wmin;
    document.getElementById('sl-wshrink').value = DEFAULTS.wshrink;
    document.getElementById('v-charge').textContent  = DEFAULTS.charge;
    document.getElementById('v-vx').textContent      = DEFAULTS.vx.toFixed(1);
    document.getElementById('v-gap').textContent     = DEFAULTS.gap;
    document.getElementById('v-grav').textContent    = DEFAULTS.grav.toFixed(2);
    document.getElementById('v-wbase').textContent   = DEFAULTS.wbase;
    document.getElementById('v-wmin').textContent    = DEFAULTS.wmin;
    document.getElementById('v-wshrink').textContent = DEFAULTS.wshrink.toFixed(2);
  });
})();
</script>
