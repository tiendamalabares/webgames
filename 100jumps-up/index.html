<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Jumps Up</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      user-select: none;
      overflow: hidden;
    }
    canvas {
      display: block;
      box-shadow: 0 0 60px rgba(100, 120, 255, 0.2);
    }
    #hint {
      color: #444;
      font-size: 12px;
      margin-top: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">HOLD SPACE to charge power · RELEASE to jump</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const W = 420, H = 600;
const GRAVITY         = 0.38;
const PLAYER_SIZE     = 28;
const PLAT_H          = 14;
const TARGET_JUMPS    = 100;
const MAX_CHARGE_MS   = 1800;
const VERT_GAP_BASE   = 130;   // vertical distance between platforms
const CAM_PLAYER_Y    = H * 0.65; // player's screen Y position (camera target)

// Difficulty scaling
const OFFSET_BASE  = 70;   // horizontal offset at jump 0
const OFFSET_GROW  = 1.4;  // pixels per jump
const OFFSET_MAX   = 180;
const WIDTH_BASE   = 130;
const WIDTH_SHRINK = 0.6;
const WIDTH_MIN    = 55;

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
canvas.width  = W;
canvas.height = H;

// ─── Game state ───────────────────────────────────────────────────────────────
let state;      // 'idle' | 'charging' | 'jumping' | 'scrolling' | 'dead' | 'win'
let player;
let platforms;
let score;
let charge;
let chargeStart;
let spaceHeld;
let cameraY;    // world Y that maps to canvas top (lower = looking further up)
let targetCamY;
let particles;
let shakeAmt;
let bestScore = 0;
let jumpDir;    // current jump direction: +1 right, -1 left

// ─── Setup ────────────────────────────────────────────────────────────────────
function platformWidth(idx) {
  return Math.max(WIDTH_MIN, WIDTH_BASE - idx * WIDTH_SHRINK);
}
function platformOffset(idx) {
  return Math.min(OFFSET_MAX, OFFSET_BASE + idx * OFFSET_GROW);
}

function reset() {
  state      = 'idle';
  charge     = 0;
  chargeStart = 0;
  spaceHeld  = false;
  score      = 0;
  particles  = [];
  shakeAmt   = 0;
  jumpDir    = 1; // first jump goes right

  // Starting platform: wide, centered, near bottom of world
  const startW  = 180;
  const startX  = W / 2 - startW / 2;
  const startY  = 1200; // world Y (high number = lower visually)
  platforms = [{ x: startX, y: startY, w: startW, h: PLAT_H, dir: null }];

  // Pre-generate platforms upward
  for (let i = 0; i < 8; i++) addNextPlatform();

  // Player on start platform
  player = {
    x: W / 2 - PLAYER_SIZE / 2,
    y: startY - PLAYER_SIZE,
    vx: 0, vy: 0,
  };

  // Camera: world Y at canvas top
  cameraY   = player.y - CAM_PLAYER_Y;
  targetCamY = cameraY;
}

function addNextPlatform() {
  const last  = platforms[platforms.length - 1];
  const idx   = platforms.length; // approximately the jump index
  const safeIdx = Math.min(idx + score, 80);

  const dir    = platforms.length % 2 === 1 ? 1 : -1; // alternating starting with right
  const offset = platformOffset(safeIdx);
  const w      = platformWidth(safeIdx);
  const vertGap = VERT_GAP_BASE + Math.random() * 30;

  // Center of last platform → offset by direction
  const lastCx = last.x + last.w / 2;
  let newCx    = lastCx + dir * offset;

  // Clamp so platform stays on screen
  newCx = Math.max(w / 2 + 15, Math.min(W - w / 2 - 15, newCx));

  platforms.push({
    x: newCx - w / 2,
    y: last.y - vertGap,
    w,
    h: PLAT_H,
    dir, // the direction the player must jump to reach it
  });
}

// ─── Input ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();

  if (state === 'dead' || state === 'win') { reset(); return; }
  if (state === 'idle' && !spaceHeld) {
    state      = 'charging';
    chargeStart = performance.now();
    spaceHeld  = true;
  }
});

document.addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  spaceHeld = false;

  if (state === 'charging') {
    const power = Math.max(0.05, charge);

    // Direction is fixed by next platform
    const nextPlat = getNextPlatform();
    const dir = nextPlat ? nextPlat.dir : jumpDir;

    // Power controls both horizontal distance AND height proportionally
    player.vx = dir * (1.8 + power * 7.5);
    player.vy = -(3.5 + power * 11);

    state  = 'jumping';
    charge = 0;
  }
});

function getNextPlatform() {
  // The platform directly above the current one the player is on
  // = first platform whose top is above the player's feet
  return platforms.find(p => p.y < player.y - PLAYER_SIZE * 0.5 && p.dir !== null);
}

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnLandParticles(x, y) {
  for (let i = 0; i < 14; i++) {
    const angle = (Math.random() * Math.PI) + Math.PI; // downward spread
    const speed = 1 + Math.random() * 3.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: -1 + Math.sin(angle) * speed,
      life: 1,
      decay: 0.035 + Math.random() * 0.04,
      size: 2 + Math.random() * 5,
      hue: 220 + Math.random() * 60,
    });
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x   += p.vx;
    p.y   += p.vy;
    p.vy  += 0.12;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update(now) {
  if (state === 'charging') {
    charge = Math.min((now - chargeStart) / MAX_CHARGE_MS, 1);
  }

  if (state === 'jumping') {
    player.vy += GRAVITY;
    player.x  += player.vx;
    player.y  += player.vy;

    // Platform collision: land on top (falling or moving upward just past it)
    for (const p of platforms) {
      if (p.dir === null) continue; // skip starting platform once left
      const bottom     = player.y + PLAYER_SIZE;
      const prevBottom = bottom - player.vy;

      if (
        player.x + PLAYER_SIZE > p.x + 3 &&
        player.x              < p.x + p.w - 3 &&
        prevBottom <= p.y + 4 &&
        bottom     >= p.y &&
        player.vy  > 0
      ) {
        // Landed!
        player.y  = p.y - PLAYER_SIZE;
        player.vx = 0;
        player.vy = 0;
        score++;
        spawnLandParticles(player.x + PLAYER_SIZE / 2, p.y);
        shakeAmt = 5;

        // Mark this platform so we don't collide with it again
        p.dir = null;

        if (score >= TARGET_JUMPS) {
          state = 'win';
          if (score > bestScore) bestScore = score;
        } else {
          state = 'idle';
          // Ensure enough platforms ahead
          while (platforms.length < 10) addNextPlatform();
        }
        break;
      }
    }

    // Death: fell below camera bottom + buffer
    if (player.y > cameraY + H + 120) {
      if (score > bestScore) bestScore = score;
      state = 'dead';
    }
    // Death: went off left or right
    if (player.x + PLAYER_SIZE < -20 || player.x > W + 20) {
      if (score > bestScore) bestScore = score;
      state = 'dead';
    }
  }

  // Camera: smoothly follow player upward (never go down)
  targetCamY = player.y - CAM_PLAYER_Y;
  if (state === 'jumping' || state === 'idle' || state === 'charging') {
    if (targetCamY < cameraY) {
      cameraY += (targetCamY - cameraY) * 0.08;
    }
  }

  // Cull platforms far below camera
  platforms = platforms.filter(p => p.y < cameraY + H + 200);
  // Keep enough platforms ahead
  while (platforms.length < 10) addNextPlatform();

  if (shakeAmt > 0) shakeAmt *= 0.72;
  updateParticles();
}

// ─── World → Screen coordinate ────────────────────────────────────────────────
function wy(worldY) { return worldY - cameraY; }

// ─── Render ───────────────────────────────────────────────────────────────────
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0a22');
  grad.addColorStop(1, '#12122a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars (static based on world position)
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137.5 + 23) % W);
    const sy = ((i * 97.3 + 11) % 3000);
    const screenY = sy - (cameraY % 3000);
    const size = i % 5 === 0 ? 2 : 1;
    ctx.fillRect(sx, ((screenY % H) + H) % H, size, size);
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    const sy = wy(p.y);
    if (sy > H + 30 || sy < -30) continue;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(p.x + 5, sy + 5, p.w, p.h);

    // Body gradient
    const g = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h);
    const isNext = p.dir !== null;
    if (isNext) {
      g.addColorStop(0, '#6488ff');
      g.addColorStop(1, '#3355cc');
    } else {
      g.addColorStop(0, '#3a3a5a');
      g.addColorStop(1, '#252535');
    }
    ctx.fillStyle = g;
    ctx.fillRect(p.x, sy, p.w, p.h);

    // Top shine
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(p.x + 2, sy + 1, p.w - 4, 3);
  }
}

function drawNextArrow() {
  if (state !== 'idle' && state !== 'charging') return;
  const next = getNextPlatform();
  if (!next) return;

  // Arrow showing direction of next jump
  const dir     = next.dir;
  const arrowY  = wy(player.y) - 12;
  const arrowX  = player.x + PLAYER_SIZE / 2 + dir * 22;
  const pulse   = 0.5 + 0.5 * Math.sin(performance.now() / 300);

  ctx.save();
  ctx.globalAlpha = 0.4 + pulse * 0.4;
  ctx.fillStyle = '#aabbff';
  ctx.font = 'bold 18px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText(dir === 1 ? '→' : '←', arrowX, arrowY);
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawTrajectory() {
  if (state !== 'charging' || charge < 0.08) return;
  const next = getNextPlatform();
  if (!next) return;

  const power = charge;
  const dir   = next.dir;
  const vx    = dir * (1.8 + power * 7.5);
  const vy    = -(3.5 + power * 11);

  let x = player.x + PLAYER_SIZE / 2;
  let y = player.y + PLAYER_SIZE / 2;
  let dvx = vx, dvy = vy;

  ctx.save();
  ctx.setLineDash([3, 7]);
  ctx.strokeStyle = 'rgba(180,200,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, wy(y));
  for (let i = 0; i < 60; i++) {
    dvy += GRAVITY;
    x   += dvx;
    y   += dvy;
    const sy = wy(y);
    if (sy > H + 20) break;
    ctx.lineTo(x, sy);
  }
  ctx.stroke();
  ctx.restore();
}

function drawPlayer() {
  const sx = Math.round(player.x);
  const sy = Math.round(wy(player.y));

  // Drop shadow on platform below
  if (state === 'jumping' && player.vy > 0) {
    const landPlat = platforms.find(p =>
      p.dir !== null &&
      player.x + PLAYER_SIZE > p.x &&
      player.x < p.x + p.w &&
      p.y > player.y
    );
    if (landPlat) {
      const dist  = landPlat.y - (player.y + PLAYER_SIZE);
      const alpha = Math.max(0, 0.35 - dist / 250);
      const scaleX = Math.max(0.2, 1 - dist / 350);
      const sw    = PLAYER_SIZE * scaleX;
      const lsy   = wy(landPlat.y);
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.fillRect(player.x + (PLAYER_SIZE - sw) / 2, lsy - 3, sw, 4);
    }
  }

  // Body
  const isScared = state === 'jumping' && player.vy > 7;
  ctx.fillStyle = isScared ? '#e74c3c' : '#e8a020';
  ctx.fillRect(sx, sy, PLAYER_SIZE, PLAYER_SIZE);

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(sx + 2, sy + 2, PLAYER_SIZE - 4, 8);

  // Eyes (tilt up when going up, down when falling)
  const eyeOff = state === 'jumping' ? (player.vy < 0 ? -2 : 2) : 0;
  ctx.fillStyle = 'white';
  ctx.fillRect(sx + 5,  sy + 8 + eyeOff, 7, 7);
  ctx.fillRect(sx + 16, sy + 8 + eyeOff, 7, 7);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(sx + 7,  sy + 10 + eyeOff, 4, 4);
  ctx.fillRect(sx + 18, sy + 10 + eyeOff, 4, 4);
}

function drawChargeBar() {
  if (state !== 'charging') return;

  const bw = 60, bh = 10;
  const bx = player.x + PLAYER_SIZE / 2 - bw / 2;
  const by = wy(player.y) - 24;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);

  let r, g;
  if (charge < 0.5) {
    r = Math.floor(charge * 2 * 255);
    g = 200;
  } else {
    r = 255;
    g = Math.floor((1 - (charge - 0.5) * 2) * 200);
  }
  ctx.fillStyle = `rgb(${r},${g},60)`;
  ctx.fillRect(bx, by, bw * charge, bh);

  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);

  // Tick marks
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (const t of [0.33, 0.66]) {
    ctx.fillRect(bx + bw * t, by + 2, 1, bh - 4);
  }
}

function drawHUD() {
  // Background panel
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, W - 20, 44);

  // Jump count
  ctx.fillStyle = '#6488ff';
  ctx.font = 'bold 18px "Courier New"';
  ctx.fillText(`JUMPS`, 20, 30);
  ctx.fillStyle = 'white';
  ctx.fillText(`${String(score).padStart(3, '0')} / ${TARGET_JUMPS}`, 90, 30);

  // Progress bar
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(20, 38, W - 40, 6);
  const pg = ctx.createLinearGradient(20, 0, W - 20, 0);
  pg.addColorStop(0, '#6488ff');
  pg.addColorStop(1, '#a0ffcc');
  ctx.fillStyle = pg;
  ctx.fillRect(20, 38, (W - 40) * (score / TARGET_JUMPS), 6);

  // Best
  if (bestScore > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.font = '11px "Courier New"';
    ctx.textAlign = 'right';
    ctx.fillText(`BEST ${bestScore}`, W - 14, 28);
    ctx.textAlign = 'left';
  }

  // Direction indicator (top right corner)
  if (state === 'idle' || state === 'charging') {
    const next = getNextPlatform();
    if (next) {
      const label = next.dir === 1 ? 'JUMP →' : '← JUMP';
      ctx.fillStyle = 'rgba(100,136,255,0.8)';
      ctx.font = 'bold 13px "Courier New"';
      ctx.textAlign = next.dir === 1 ? 'right' : 'left';
      ctx.fillText(label, next.dir === 1 ? W - 14 : 14, H - 14);
      ctx.textAlign = 'left';
    }
  }

  // First-time hint
  if (score === 0 && state === 'idle') {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '13px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText('Hold SPACE · release to jump', W / 2, H - 14);
    ctx.textAlign = 'left';
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = `hsl(${p.hue}, 70%, 65%)`;
    ctx.fillRect(p.x - p.size / 2, wy(p.y) - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawOverlay() {
  if (state !== 'dead' && state !== 'win') return;

  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  if (state === 'dead') {
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 46px "Courier New"';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 40);

    ctx.fillStyle = 'white';
    ctx.font = '20px "Courier New"';
    ctx.fillText(`${score} jump${score !== 1 ? 's' : ''} up`, W / 2, H / 2 + 10);

    if (score === bestScore && score > 0) {
      ctx.fillStyle = '#f1c40f';
      ctx.font = '15px "Courier New"';
      ctx.fillText('NEW BEST!', W / 2, H / 2 + 40);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '14px "Courier New"';
    ctx.fillText('SPACE to retry', W / 2, H / 2 + 75);
  }

  if (state === 'win') {
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 46px "Courier New"';
    ctx.fillText('YOU WIN!', W / 2, H / 2 - 40);

    ctx.fillStyle = 'white';
    ctx.font = '20px "Courier New"';
    ctx.fillText('100 jumps reached!', W / 2, H / 2 + 10);

    ctx.fillStyle = '#6488ff';
    ctx.font = '14px "Courier New"';
    ctx.fillText('SPACE to play again', W / 2, H / 2 + 55);
  }

  ctx.textAlign = 'left';
}

// ─── Loop ─────────────────────────────────────────────────────────────────────
function loop(now) {
  update(now);

  const sx = shakeAmt > 0.5 ? (Math.random() - 0.5) * shakeAmt * 2 : 0;
  const sy = shakeAmt > 0.5 ? (Math.random() - 0.5) * shakeAmt * 2 : 0;

  ctx.save();
  if (sx || sy) ctx.translate(sx, sy);

  drawBackground();
  drawPlatforms();
  drawParticles();
  drawTrajectory();
  drawNextArrow();
  drawChargeBar();
  drawPlayer();
  drawHUD();
  drawOverlay();

  ctx.restore();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
