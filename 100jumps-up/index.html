<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Jumps Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05050f;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Space Grotesk', 'Courier New', monospace;
      touch-action: none;
    }

    #wrap {
      position: relative;
      /* scaled via JS to fit viewport */
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* Mobile tap overlay */
    #tap {
      position: absolute;
      inset: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Settings panel ── */
    #cfg-btn {
      position: fixed;
      top: 10px; right: 10px;
      z-index: 200;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(100,136,255,0.25);
      border: 1px solid rgba(100,136,255,0.5);
      color: #aac0ff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      touch-action: auto;
      transition: background 0.15s;
    }
    #cfg-btn:hover { background: rgba(100,136,255,0.45); }

    #cfg-panel {
      position: fixed;
      top: 0; right: -260px;
      width: 250px; height: 100vh;
      background: rgba(4,4,18,0.97);
      border-left: 1px solid rgba(100,136,255,0.25);
      padding: 52px 16px 20px;
      z-index: 199;
      transition: right 0.2s ease;
      touch-action: auto;
      overflow-y: auto;
      font-family: 'Space Grotesk', monospace;
      color: #c8d8ff;
      font-size: 12px;
    }
    #cfg-panel.open { right: 0; }

    #cfg-panel h3 {
      font-size: 13px;
      font-weight: 700;
      color: #6488ff;
      letter-spacing: .08em;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .cfg-row {
      margin-bottom: 16px;
    }
    .cfg-row label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: rgba(200,216,255,0.75);
    }
    .cfg-row label span {
      color: #fff;
      font-weight: 700;
      min-width: 40px;
      text-align: right;
    }
    .cfg-row input[type=range] {
      width: 100%;
      accent-color: #6488ff;
      cursor: pointer;
    }

    .cfg-reset {
      margin-top: 20px;
      width: 100%;
      padding: 8px;
      background: rgba(100,136,255,0.15);
      border: 1px solid rgba(100,136,255,0.4);
      border-radius: 6px;
      color: #aac0ff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: auto;
    }
    .cfg-reset:hover { background: rgba(100,136,255,0.3); }
  </style>
</head>
<body>

<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="tap"></div>
</div>

<button id="cfg-btn" title="Ajustes">⚙</button>

<div id="cfg-panel">
  <h3>Ajustes</h3>

  <div class="cfg-row">
    <label>Velocidad carga <span id="v-charge">800</span>ms</label>
    <input type="range" id="sl-charge" min="200" max="2000" step="50" value="800">
  </div>
  <div class="cfg-row">
    <label>Alcance horiz. <span id="v-vx">3.5</span></label>
    <input type="range" id="sl-vx" min="1" max="7" step="0.1" value="3.5">
  </div>
  <div class="cfg-row">
    <label>Altura salto <span id="v-gap">150</span>px</label>
    <input type="range" id="sl-gap" min="60" max="300" step="10" value="150">
  </div>
  <div class="cfg-row">
    <label>Gravedad <span id="v-grav">0.75</span></label>
    <input type="range" id="sl-grav" min="0.2" max="2" step="0.05" value="0.75">
  </div>
  <div class="cfg-row">
    <label>Ancho inicial <span id="v-wbase">80</span>px</label>
    <input type="range" id="sl-wbase" min="10" max="180" step="5" value="80">
  </div>
  <div class="cfg-row">
    <label>Ancho mínimo <span id="v-wmin">10</span>px</label>
    <input type="range" id="sl-wmin" min="4" max="80" step="2" value="10">
  </div>
  <div class="cfg-row">
    <label>Reduc. ancho/salto <span id="v-wshrink">0.75</span></label>
    <input type="range" id="sl-wshrink" min="0" max="3" step="0.05" value="0.75">
  </div>

  <div class="cfg-row" style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
    <label style="margin:0">Línea trayectoria</label>
    <input type="checkbox" id="sl-traj" style="width:18px;height:18px;accent-color:#6488ff;cursor:pointer;touch-action:auto">
  </div>

  <button class="cfg-reset" id="cfg-reset-btn">↺ Valores por defecto</button>
</div>

<script>
// ─── Canvas & scaling ────────────────────────────────────────────────────────
const CW = 420, CH = 640;  // logical resolution
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('wrap');
canvas.width  = CW;
canvas.height = CH;

function resize() {
  const scale = Math.min(window.innerWidth / CW, window.innerHeight / CH, 2);
  wrap.style.width  = `${CW * scale}px`;
  wrap.style.height = `${CH * scale}px`;
  canvas.style.width  = `${CW * scale}px`;
  canvas.style.height = `${CH * scale}px`;
}
window.addEventListener('resize', resize);
resize();

// ─── Constants ───────────────────────────────────────────────────────────────
const W = CW, H = CH;
const PLAYER_SIZE   = 28;
const PLAT_H        = 14;
const TARGET_JUMPS  = 100;
const CAM_PLAYER_Y  = H * 0.65;

// Tweakable via sliders
let GRAVITY       = 0.75;
let MAX_CHARGE_MS = 800;
let VERT_GAP      = 150;
let WIDTH_BASE    = 80;
let WIDTH_SHRINK  = 1.1;
let WIDTH_MIN     = 44;
let MAX_VX        = 3.5;
let SHOW_TRAJ     = false;          // trajectory line off by default

// ─── State ───────────────────────────────────────────────────────────────────
// states: 'intro' | 'idle' | 'charging' | 'jumping' | 'dead' | 'win'
let state, player, platforms, score, charge, chargeStart;
let spaceHeld, cameraY, camTarget, camSliding, particles, shakeAmt, bestScore = 0;
let introAnim = 0; // for intro screen animation
let nextPlatDir = 1; // alternates ±1 independently of array length

// ─── Helpers ─────────────────────────────────────────────────────────────────
const platWidth  = i => Math.max(WIDTH_MIN,  WIDTH_BASE  - i * WIDTH_SHRINK);
const wy         = worldY => worldY - cameraY;
const lerp       = (a, b, t) => a + (b - a) * t;

function rand(min, max) { return min + Math.random() * (max - min); }

// ─── Platform generation ─────────────────────────────────────────────────────
function addNextPlatform() {
  const last    = platforms[platforms.length - 1];
  const idx     = platforms.length;
  const safeIdx = Math.min(idx + score, 85);
  const w       = platWidth(safeIdx);
  const minCx   = w / 2 + 18;
  const maxCx   = W - w / 2 - 18;
  const lastCx  = last.x + last.w / 2;

  // Choose direction that has room; prefer alternating
  let dir = nextPlatDir;
  const roomDir  = dir === 1 ? maxCx - lastCx : lastCx - minCx;
  if (roomDir < 15) dir = -dir; // flip if no room
  nextPlatDir = -dir;

  // X offset: grows with difficulty + small jitter to break mechanical L-R feel
  const maxOff  = Math.min(110, dir === 1 ? maxCx - lastCx : lastCx - minCx);
  const baseOff = Math.min(maxOff, 40 + safeIdx * 1.3);
  const rawOff  = rand(25, Math.max(25, baseOff)) + rand(-10, 10);
  const offset  = Math.max(20, rawOff);
  let newCx     = lastCx + dir * offset;
  newCx = Math.max(minCx, Math.min(maxCx, newCx));
  // Y gap: grows with difficulty (early ~40-80px, late ~85-115px)
  const vertGap = rand(40, 80) + rand(0, 25) + Math.min(safeIdx * 0.35, 30);
  // Bright climbing-hold colours — never repeat the last colour
  const HOLD_COLS = ['#e05828','#f0a820','#28a860','#2888d0','#9050c8','#d82878','#20b8a8','#88b820'];
  const lastCol   = last.color || '';
  let color = lastCol;
  while (color === lastCol) color = HOLD_COLS[Math.floor(Math.random() * HOLD_COLS.length)];
  const shape = Math.floor(Math.random() * 5);
  platforms.push({ x: newCx - w / 2, y: last.y - vertGap, w, h: PLAT_H, dir, color, shape });
}

// ─── Reset / init ────────────────────────────────────────────────────────────
function reset() {
  state      = 'idle';
  charge     = 0;
  chargeStart = 0;
  spaceHeld  = false;
  score      = 0;
  particles  = [];
  shakeAmt   = 0;

  const startW = 180, startX = W / 2 - 90, startY = 1400;
  nextPlatDir = 1;
  platforms = [{ x: startX, y: startY, w: startW, h: PLAT_H, dir: null, color: '#b0a898', shape: 0 }];
  addNextPlatform();  // only 1 target visible at a time

  // player.y = hand position (grabs platform TOP edge, body hangs below)
  player  = { x: W / 2 - PLAYER_SIZE / 2, y: startY, vx: 0, vy: 0, grabDir: 1 };
  cameraY   = player.y - CAM_PLAYER_Y;
  camTarget = cameraY;
  camSliding = false;
}

// ─── Input ───────────────────────────────────────────────────────────────────
function onPress() {
  if (state === 'intro')            { reset(); return; }
  if (state === 'dead' || state === 'win') { reset(); return; }
  if (state === 'idle' && !spaceHeld) {
    state       = 'charging';
    chargeStart = performance.now();
    spaceHeld   = true;
  }
}

function onRelease() {
  spaceHeld = false;
  if (state !== 'charging') return;

  const next    = getNextPlatform();
  const dir     = next ? next.dir : 1;
  player.vx     = dir * charge * MAX_VX;
  player.vy     = -17;                 // fixed height, only horizontal varies
  state         = 'jumping';
  charge        = 0;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); onPress(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') onRelease();
});

// Touch / click
const tapEl = document.getElementById('tap');
tapEl.addEventListener('pointerdown', e => { e.preventDefault(); onPress(); });
tapEl.addEventListener('pointerup',   e => { e.preventDefault(); onRelease(); });

// ─── Game logic ───────────────────────────────────────────────────────────────
function getNextPlatform() {
  // player.y = hand (= cube bottom in original). Original: p.y < cubeTop - SIZE*0.4
  // = p.y < (hand - SIZE) - SIZE*0.4 = hand - SIZE*1.4
  return platforms.find(p => p.dir !== null && p.y < player.y - PLAYER_SIZE * 1.4);
}

function spawnParticles(x, y) {
  for (let i = 0; i < 16; i++) {
    const angle = Math.PI + rand(-0.6, 0.6) * Math.PI;
    const speed = rand(1, 4);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      life: 1,
      decay: rand(0.03, 0.06),
      size: rand(2, 5),
      hue: rand(210, 270),
    });
  }
}

function update(now) {
  if (state === 'intro') {
    introAnim = now;
    return;
  }

  if (state === 'charging') {
    charge = Math.min((now - chargeStart) / MAX_CHARGE_MS, 1);
  }

  if (state === 'jumping') {
    player.vy += GRAVITY;
    player.x  += player.vx;
    player.y  += player.vy;

    if (player.vy > 0) {  // falling — grab platform top (same as cube landing on platform)
      for (const p of platforms) {
        if (p.dir === null) continue;
        const hand     = player.y;           // hand = cube's bottom in original
        const prevHand = hand - player.vy;
        if (
          player.x + PLAYER_SIZE > p.x + 3 &&
          player.x               < p.x + p.w - 3 &&
          prevHand <= p.y + 5 &&             // same +5 tolerance as original
          hand     >= p.y
        ) {
          player.y  = p.y;                   // hand snaps to platform top
          player.vx = 0; player.vy = 0;
          player.grabDir = -player.grabDir;
          score++;
          spawnParticles(player.x + PLAYER_SIZE / 2, p.y);
          shakeAmt = 5;
          p.dir = null;

          if (score >= TARGET_JUMPS) {
            state = 'win';
            if (score > bestScore) bestScore = score;
          } else {
            state = 'idle';
            addNextPlatform(); // add new target before sliding
            camTarget  = player.y - CAM_PLAYER_Y;
            camSliding = true;
          }
          break;
        }
      }
    }

    if (player.y > cameraY + H + 140 ||
        player.x + PLAYER_SIZE < -30 ||
        player.x > W + 30) {
      if (score > bestScore) bestScore = score;
      state = 'dead';
    }
  }

  // Camera: still while player is in the air, slides on landing
  if (camSliding) {
    cameraY = lerp(cameraY, camTarget, 0.07);
    if (Math.abs(cameraY - camTarget) < 0.5) { cameraY = camTarget; camSliding = false; }
  }

  // Cull platforms that are more than 1.5 screens below camera (memory safety)
  platforms = platforms.filter(p => p.y < cameraY + H * 1.5);
  // Ensure 1 target platform always exists above the player
  const hasTarget = platforms.some(p => p.dir !== null && p.y < player.y - PLAYER_SIZE * 1.4);
  if (!hasTarget) addNextPlatform();

  // Particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12; p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);

  if (shakeAmt > 0) shakeAmt *= 0.7;
}

// ─── Draw helpers ────────────────────────────────────────────────────────────
// ─── Hold shapes ─────────────────────────────────────────────────────────────
// Draw a climbing-hold silhouette path. cx/cy = visual centre, w/h = bounds.
function holdPath(type, cx, cy, w, h) {
  const hw = w / 2, hh = h / 2;
  ctx.beginPath();
  switch (type % 5) {
    case 0: // Jug — classic curved C-shape
      ctx.moveTo(cx - hw, cy + hh * 0.15);
      ctx.bezierCurveTo(cx - hw * 1.05, cy - hh * 1.1, cx + hw * 1.05, cy - hh * 1.1, cx + hw, cy + hh * 0.15);
      ctx.bezierCurveTo(cx + hw * 0.65, cy + hh, cx - hw * 0.65, cy + hh, cx - hw, cy + hh * 0.15);
      break;
    case 1: // Sloper — smooth dome
      ctx.ellipse(cx, cy - hh * 0.05, hw * 1.05, hh * 0.92, 0, 0, Math.PI * 2);
      break;
    case 2: // Crimp — flat rail with shallow depth
      ctx.moveTo(cx - hw, cy - hh * 0.05);
      ctx.bezierCurveTo(cx - hw * 1.02, cy - hh * 0.85, cx + hw * 1.02, cy - hh * 0.85, cx + hw, cy - hh * 0.05);
      ctx.bezierCurveTo(cx + hw * 0.75, cy + hh * 0.85, cx - hw * 0.75, cy + hh * 0.85, cx - hw, cy - hh * 0.05);
      break;
    case 3: // Pinch — slightly rotated oval
      ctx.ellipse(cx, cy, hw * 0.98, hh * 0.88, 0.18, 0, Math.PI * 2);
      break;
    case 4: // Volume — irregular triangular bump
      ctx.moveTo(cx - hw, cy + hh * 0.55);
      ctx.bezierCurveTo(cx - hw * 1.1, cy - hh * 0.15, cx - hw * 0.15, cy - hh, cx + hw * 0.2, cy - hh);
      ctx.bezierCurveTo(cx + hw * 0.9, cy - hh * 0.55, cx + hw * 1.1, cy + hh * 0.1, cx + hw, cy + hh * 0.55);
      ctx.bezierCurveTo(cx + hw * 0.45, cy + hh, cx - hw * 0.45, cy + hh, cx - hw, cy + hh * 0.55);
      break;
  }
  ctx.closePath();
}

// Deterministic pseudo-random from integer seed
function seededRand(seed) {
  const s = ((seed * 1664525 + 1013904223) & 0x7fffffff);
  return s / 0x7fffffff;
}

// ─── Logo mural ──────────────────────────────────────────────────────────────
// Three overlapping mountain triangles painted on the gym wall,
// tiled every LOGO_TILE world units so the player sees it throughout the climb.
const LOGO_TILE  = 700;
const LOGO_START = 1300;   // first tile world-Y base (above start platform)

function drawLogoMural() {
  const t = state === 'intro' ? 0 : cameraY;
  const firstTile = Math.floor((t - H) / LOGO_TILE);
  const lastTile  = Math.ceil((t + H) / LOGO_TILE);

  for (let tile = firstTile; tile <= lastTile; tile++) {
    const worldBaseY = LOGO_START - tile * LOGO_TILE;
    const baseY = worldBaseY - t;
    if (baseY < -300 || baseY > H + 60) continue;

    ctx.save();
    ctx.globalAlpha = 0.40;

    const cx = W / 2;
    // 5 overlapping triangular polygons forming a crown/mountain logo
    // Draw order: back→front so front shapes cover back ones
    // [colour, tipX, tipY, baseLeft, baseRight]
    const tri = [
      // 1. Dark purple — right outer (widest, behind)
      ['#5840a8', cx + W*0.16, baseY - 178, cx - W*0.01, cx + W*0.28],
      // 2. Dark teal — left outer (widest, behind)
      ['#2878a8', cx - W*0.16, baseY - 178, cx - W*0.28, cx + W*0.01],
      // 3. Lavender — right narrow spike (tall, in front of purple)
      ['#a090c8', cx + W*0.085, baseY - 232, cx + W*0.00, cx + W*0.18],
      // 4. Sky blue — left narrow spike (tall, in front of teal)
      ['#78b8d8', cx - W*0.085, baseY - 232, cx - W*0.18, cx - W*0.00],
      // 5. Orange — center (tallest, front)
      ['#c8782a', cx,           baseY - 250, cx - W*0.13, cx + W*0.13],
    ];

    for (const [col, tx, ty, bl, br] of tri) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(bl, baseY);
      ctx.lineTo(br, baseY);
      ctx.closePath();
      ctx.fill();
    }

    // White polka dots inside each triangle
    // [triIdx, tFrac(0=tip→1=base), uFrac(0=left→1=right)]
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    const dots = [
      // dark purple (0)
      [0, 0.38, 0.32], [0, 0.58, 0.55], [0, 0.72, 0.28], [0, 0.82, 0.60],
      // dark teal (1)
      [1, 0.38, 0.68], [1, 0.58, 0.45], [1, 0.72, 0.72], [1, 0.82, 0.40],
      // lavender (2)
      [2, 0.35, 0.48], [2, 0.58, 0.30], [2, 0.72, 0.65],
      // sky blue (3)
      [3, 0.35, 0.52], [3, 0.58, 0.70], [3, 0.72, 0.35],
      // orange (4)
      [4, 0.28, 0.50], [4, 0.48, 0.28], [4, 0.48, 0.72],
      [4, 0.68, 0.50], [4, 0.82, 0.28], [4, 0.82, 0.72],
    ];
    for (const [ti, tf, uf] of dots) {
      const [, tx, ty, bl, br] = tri[ti];
      const lx = tx + (bl - tx) * tf;
      const rx = tx + (br - tx) * tf;
      const dx = lx + (rx - lx) * uf;
      const dy = ty + (baseY - ty) * tf;
      ctx.beginPath();
      ctx.arc(dx, dy, 6 + tf * 5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function drawBgHolds() {
  const ROW_H = 52, COLS = 9;
  const t     = state === 'intro' ? 0 : cameraY;
  const firstRow = Math.floor(t / ROW_H) - 1;
  const lastRow  = Math.ceil((t + H) / ROW_H) + 1;

  for (let row = firstRow; row <= lastRow; row++) {
    const rowBase = (Math.abs(row) * 6271 + 987654) | 0;
    const nHolds  = 3 + (Math.abs(rowBase) % 4); // 3–6 per row
    for (let i = 0; i < nHolds; i++) {
      const s1 = (seededRand(rowBase + i * 7 + 1) * 0xffffff) | 0;
      const s2 = (seededRand(rowBase + i * 7 + 2) * 0xffffff) | 0;
      const s3 = (seededRand(rowBase + i * 7 + 3) * 0xffffff) | 0;
      const s4 = (seededRand(rowBase + i * 7 + 4) * 0xffffff) | 0;

      const hx   = 14 + seededRand(s1) * (W - 28);
      const hy   = row * ROW_H + seededRand(s2) * ROW_H;
      const sy   = hy - t;
      if (sy < -35 || sy > H + 35) continue;

      const typ  = Math.abs(s3) % 5;
      const w    = 12 + seededRand(s4) * 24;   // 12–36 px
      const h    = w * (0.55 + seededRand(s1 ^ s2) * 0.35);
      const alp  = 0.22 + seededRand(s2 ^ s3) * 0.22;

      // Shadow
      ctx.fillStyle = `rgba(100,90,75,${alp * 0.5})`;
      holdPath(typ, hx + 1.5, sy + 2, w, h);
      ctx.fill();
      // Hold body
      ctx.fillStyle = `rgba(165,156,140,${alp})`;
      holdPath(typ, hx, sy, w, h);
      ctx.fill();
    }
  }
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16) + amt);
  const g = Math.min(255, ((n >> 8) & 0xff) + amt);
  const b = Math.min(255, (n & 0xff) + amt);
  return `rgb(${r},${g},${b})`;
}
function darken(hex, amt) { return lighten(hex, -amt); }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

// ─── Render ──────────────────────────────────────────────────────────────────
function drawBg() {
  // Climbing gym wall — warm off-white
  ctx.fillStyle = '#e4e0d6';
  ctx.fillRect(0, 0, W, H);

  // Subtle wall gradient (slightly darker at bottom)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(255,255,240,0.25)');
  grad.addColorStop(1, 'rgba(0,0,0,0.08)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Bolt-hole dot grid (like a real climbing wall)
  const t   = (state === 'intro') ? 0 : cameraY;
  const gap = 28;
  ctx.fillStyle = 'rgba(80,70,55,0.22)';
  for (let col = 0; col < W / gap + 1; col++) {
    for (let row = -1; row < H / gap + 2; row++) {
      const dx = col * gap + (row % 2 === 0 ? gap / 2 : 0);
      const dy = (row * gap - (t % gap) + gap) % (H + gap * 2) - gap;
      ctx.beginPath();
      ctx.arc(dx, dy, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPlatforms() {
  const next = getNextPlatform();
  for (const p of platforms) {
    const sy = wy(p.y);
    if (sy > H + 40 || sy < -40) continue;

    const isActive = p.dir !== null;
    const isTarget = p === next;

    // Hold colour: active = bright, grabbed = grey
    const holdCol = isActive ? (p.color || '#3a9ad0') : '#a09888';
    const shape   = p.shape ?? 0;
    // Visual hold is taller than the collision box for a 3-D look
    const drawH = Math.max(p.h * 2.8, 28);
    const cx    = p.x + p.w / 2;
    const cy    = sy + p.h * 0.3;  // grip top near p.y, body hangs below

    // Pulse glow on target
    if (isTarget && (state === 'idle' || state === 'charging')) {
      const pulse = 0.4 + 0.3 * Math.sin(performance.now() / 400);
      ctx.shadowColor = holdCol;
      ctx.shadowBlur  = 20 * pulse;
    }

    // Wall shadow (offset blob)
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    holdPath(shape, cx + 2.5, cy + 3, p.w, drawH);
    ctx.fill();

    // Hold body gradient
    const g = ctx.createLinearGradient(cx, cy - drawH / 2, cx, cy + drawH / 2);
    g.addColorStop(0,   lighten(holdCol, 40));
    g.addColorStop(0.4, holdCol);
    g.addColorStop(1,   darken(holdCol, 35));
    ctx.fillStyle = g;
    holdPath(shape, cx, cy, p.w, drawH);
    ctx.fill();

    // Highlight (top sheen)
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    holdPath(shape, cx, cy - drawH * 0.18, p.w * 0.7, drawH * 0.45);
    ctx.fill();

    ctx.shadowBlur = 0;
  }
}

function drawTrajectory() {
  if (!SHOW_TRAJ || state !== 'charging') return;
  const next = getNextPlatform();
  if (!next) return;

  const dir = next.dir;
  const vx  = dir * charge * MAX_VX;      // same as onRelease
  const vy  = -17;                         // same as onRelease (fixed height)
  let x = player.x + PLAYER_SIZE / 2;
  let y = player.y;                        // hand position (same as cube bottom)
  let dvx = vx, dvy = vy;
  let landX = x, landY = y;

  ctx.save();
  ctx.shadowColor = 'rgba(40,40,0,0.3)';
  ctx.shadowBlur  = 4;
  ctx.setLineDash([4, 7]);
  ctx.strokeStyle = `rgba(40,20,0,${0.25 + charge * 0.5})`;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x, wy(y));

  for (let i = 0; i < 200; i++) {
    const prevY = y;
    dvy += GRAVITY;
    x   += dvx;
    y   += dvy;
    // Stop when falling hand reaches platform top (same as original)
    if (dvy > 0 && prevY < next.y && y >= next.y) {
      const frac = (next.y - prevY) / (y - prevY);
      landX = x - dvx * (1 - frac);
      landY = next.y;
      ctx.lineTo(landX, wy(landY));
      break;
    }
    landX = x; landY = y;
    if (wy(y) > H + 10) break;
    ctx.lineTo(x, wy(y));
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Landing dot on the platform level
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.arc(landX, wy(landY), 5, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(40,20,0,${0.4 + charge * 0.5})`;
  ctx.fill();

  ctx.restore();
}

function drawPlayer() {
  const cx  = Math.round(player.x + PLAYER_SIZE / 2);
  const gy  = Math.round(wy(player.y));   // grab point Y on screen
  const gd  = player.grabDir || 1;
  const isFlying = state === 'jumping';

  ctx.save();
  ctx.translate(cx, gy);

  // Each "pixel" = 2×2 screen pixels for pixel-art look
  const S = 2;
  function px(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x * S, y * S, w * S, h * S);
  }

  // Colour palette (reference: back-view rock climber)
  const SK  = '#f0c898'; // skin
  const SKD = '#c89060'; // skin shadow
  const HR  = '#d8b020'; // blonde hair
  const HRD = '#a08010'; // hair dark
  const BRA = '#d82040'; // pink sports bra
  const BRL = '#f04468'; // bra highlight
  const JNS = '#3a70b8'; // jeans blue
  const JND = '#2a5090'; // jeans dark
  const BLT = '#7a5420'; // harness/belt
  const BLD = '#4a3010'; // belt buckle dark
  const SHO = '#181420'; // shoes

  if (!isFlying) {
    // ── Hanging pose (back view, one arm raised to grab point) ──
    // Arm from grab point (0,0) downward — disappears behind platform top,
    // emerges at platform bottom (PLAT_H/S = 7 sprite-px below).
    // gd: +1 = right arm up, -1 = left arm up
    const armX = gd;          // centre offset of raised arm (sprite px from 0)
    px(armX-1,  0,  2, 10, SK);    // raised arm (forearm + upper arm)
    px(armX + (gd > 0 ? 0 : -1), 0, 1, 10, SKD); // arm shadow

    // Hair (visible at shoulder height, back of head)
    px(-3,  8,  6,  2, HRD);
    px(-3,  9,  6,  2, HR);

    // Head (back view — no face, just rounded shape + hair)
    px(-3, 11,  6,  5, SK);
    px(-3, 11,  1,  5, SKD);
    px( 2, 11,  1,  5, SKD);

    // Neck
    px(-1, 16,  2,  2, SK);

    // Torso — pink sports bra, back view with cross straps
    px(-4, 18,  8, 10, BRA);
    px(-4, 18,  1, 10, '#9a0020');  // left shadow
    px( 3, 18,  1, 10, '#9a0020');  // right shadow
    px(-1, 18,  1,  5, BRL);        // cross strap L
    px( 0, 18,  1,  5, BRL);        // cross strap R
    px(-3, 24,  6,  4, '#b01030');  // lower back

    // Free arm (hanging down, opposite side)
    const hx = gd > 0 ? -6 : 4;
    px(hx,    18,  2,  7, SK);   // upper arm
    px(hx,    18,  1,  7, SKD);
    px(hx+1,  25,  2,  7, SK);   // forearm
    px(hx+1,  25,  1,  7, SKD);

    // Harness / belt
    px(-5, 28, 10,  2, BLT);
    px(-4, 30,  8,  1, BLD);
    px(-5, 28,  2,  2, BLD);    // left clip
    px( 3, 28,  2,  2, BLD);    // right clip

    // Legs — 3/4 capri jeans
    px(-5, 31,  4, 12, JNS);
    px( 1, 31,  4, 12, JNS);
    px(-5, 31,  1, 12, JND);    // outer shadow L
    px(-2, 31,  1, 12, JND);    // inner gap
    px( 1, 31,  1, 12, JND);    // inner gap
    px( 4, 31,  1, 12, JND);    // outer shadow R

    // Shoes (dark climbing shoes)
    px(-6, 43,  5,  2, SHO);
    px( 1, 43,  5,  2, SHO);
    px(-5, 45,  3,  1, SHO);
    px( 2, 45,  3,  1, SHO);

  } else {
    // ── Flying pose (launched, body slightly rotated by velocity) ──
    const angle = Math.atan2(player.vy, player.vx) * 0.35;
    // Pivot around body centre (~18 sp below grab point)
    ctx.translate(0, 18 * S);
    ctx.rotate(angle);

    // Head
    px(-3, -16,  6,  2, HRD);  // hair dark
    px(-3, -14,  6,  2, HR);   // hair
    px(-3, -12,  6,  5, SK);   // head
    px(-3, -12,  1,  5, SKD);
    px( 2, -12,  1,  5, SKD);

    // Neck
    px(-1,  -7,  2,  2, SK);

    // Torso
    px(-4,  -5,  8,  9, BRA);
    px(-4,  -5,  1,  9, '#9a0020');
    px( 3,  -5,  1,  9, '#9a0020');
    px(-1,  -5,  2,  4, BRL);

    // Belt
    px(-5,   4, 10,  2, BLT);

    // Legs (slightly trailing behind body when flying)
    px(-5,   6,  4, 11, JNS);
    px( 1,   6,  4, 11, JNS);
    px(-5,   6,  1, 11, JND);
    px(-2,   6,  1, 11, JND);
    px( 1,   6,  1, 11, JND);
    px( 4,   6,  1, 11, JND);

    // Shoes
    px(-6,  17,  5,  2, SHO);
    px( 1,  17,  5,  2, SHO);

    // Arms drawn in screen-space (un-rotate) so they point in real directions
    ctx.rotate(-angle);
    // Reaching arm (toward next platform — upward)
    const ax = gd;
    px(ax*3-1, -28,  2, 12, SK);
    px(ax*3 + (gd > 0 ? 0 : -1), -28, 1, 12, SKD);
    // Trailing / released arm
    const tx = gd > 0 ? -7 : 5;
    px(tx,    -5,  2,  8, SK);
    px(tx,    -5,  1,  8, SKD);
    px(tx+1,   3,  2,  6, SK);
    px(tx+1,   3,  1,  6, SKD);
  }

  ctx.restore();
}

function drawChargeBar() {
  if (state !== 'charging') return;
  const bw = 64, bh = 11;
  const bx = player.x + PLAYER_SIZE / 2 - bw / 2;
  const by = wy(player.y) - 28;

  // Bg
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(bx - 2, by - 2, bw + 4, bh + 4, 4);

  // Fill
  let r, g;
  if (charge < 0.5) { r = Math.floor(charge * 2 * 255); g = 200; }
  else              { r = 255; g = Math.floor((1 - (charge - 0.5) * 2) * 200); }
  ctx.fillStyle = `rgb(${r},${g},50)`;
  if (charge > 0) roundRect(bx, by, bw * charge, bh, 3);

  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth   = 1;
  ctx.strokeRect(bx, by, bw, bh);

  // Ticks
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  for (const t of [1/3, 2/3]) ctx.fillRect(bx + bw * t, by + 2, 1, bh - 4);
}

function drawArrow() {
  if (state !== 'idle' && state !== 'charging') return;
  const next = getNextPlatform();
  if (!next) return;
  const dir   = next.dir;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 350);
  const ax    = dir === 1 ? player.x + PLAYER_SIZE + 10 : player.x - 10;
  const ay    = wy(player.y) + 70;  // below character feet (char ~90px tall)

  ctx.save();
  ctx.globalAlpha = 0.3 + pulse * 0.5;
  ctx.fillStyle   = 'rgba(60,40,20,0.7)';
  ctx.font        = 'bold 20px "Space Grotesk", monospace';
  ctx.textAlign   = dir === 1 ? 'left' : 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(dir === 1 ? '▶' : '◀', ax, ay);
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = `hsl(${p.hue},75%,40%)`;
    ctx.fillRect(p.x - p.size / 2, wy(p.y) - p.size / 2, p.size, p.size);
  }
  ctx.restore();
}

function drawHUD() {
  // Top bar background
  ctx.fillStyle = 'rgba(228,224,214,0.92)';
  ctx.fillRect(0, 0, W, 58);
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 57, W, 1);

  // JUMPS label
  ctx.fillStyle = 'rgba(80,60,40,0.7)';
  ctx.font      = '11px "Space Grotesk", monospace';
  ctx.fillText('JUMPS', 16, 18);

  // Count
  ctx.fillStyle = '#1a1008';
  ctx.font      = 'bold 26px "Space Grotesk", monospace';
  ctx.fillText(`${score}`, 16, 44);

  // /100
  ctx.fillStyle = 'rgba(60,40,20,0.35)';
  ctx.font      = '14px "Space Grotesk", monospace';
  ctx.fillText(`/ ${TARGET_JUMPS}`, 16 + ctx.measureText(`${score}`).width + 5, 44);

  // Progress bar
  const bx = 16, by = 50, bw = W - 32, bh = 4;
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.fillRect(bx, by, bw, bh);
  const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  pg.addColorStop(0, '#e05828');
  pg.addColorStop(0.5, '#f0a820');
  pg.addColorStop(1, '#28a860');
  ctx.fillStyle = pg;
  ctx.fillRect(bx, by, bw * (score / TARGET_JUMPS), bh);

  // Best score (top right)
  if (bestScore > 0) {
    ctx.fillStyle = 'rgba(60,40,20,0.35)';
    ctx.font      = '11px "Space Grotesk", monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`BEST  ${bestScore}`, W - 14, 18);
    ctx.textAlign = 'left';
  }

  // Jump direction label (bottom of screen)
  if (state === 'idle' || state === 'charging') {
    const next = getNextPlatform();
    if (next) {
      const lbl = next.dir === 1 ? '▶  JUMP RIGHT' : 'JUMP LEFT  ◀';
      ctx.fillStyle  = 'rgba(60,40,20,0.55)';
      ctx.font       = 'bold 12px "Space Grotesk", monospace';
      ctx.textAlign  = 'center';
      ctx.fillText(lbl, W / 2, H - 14);
      ctx.textAlign  = 'left';
    }
  }

  // First-run hint
  if (score === 0 && state === 'idle') {
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font      = '13px "Space Grotesk", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Hold SPACE to charge · release to jump', W / 2, H - 34);
    ctx.textAlign = 'left';
  }
}

// ─── Intro screen ────────────────────────────────────────────────────────────
function drawIntro(now) {
  drawBg();

  // Title
  const pulse = 0.92 + 0.08 * Math.sin(now / 600);
  ctx.save();
  ctx.translate(W / 2, H / 2 - 60);
  ctx.scale(pulse, pulse);

  // Big number
  ctx.fillStyle = '#6488ff';
  ctx.font      = 'bold 96px "Space Grotesk", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('100', 0, -30);

  ctx.fillStyle = '#1a1008';
  ctx.font      = 'bold 36px "Space Grotesk", monospace';
  ctx.fillText('JUMPS UP', 0, 40);

  ctx.restore();

  // Animated mini player demo
  const demoX = W / 2 - 14;
  const demoY = H / 2 + 80 + Math.sin(now / 500) * 8;
  ctx.fillStyle = '#f0a030';
  ctx.fillRect(demoX, demoY, 28, 28);
  ctx.fillStyle = 'white';
  ctx.fillRect(demoX + 5,  demoY + 8,  7, 7);
  ctx.fillRect(demoX + 16, demoY + 8,  7, 7);
  ctx.fillStyle = '#111';
  ctx.fillRect(demoX + 7,  demoY + 10, 4, 4);
  ctx.fillRect(demoX + 18, demoY + 10, 4, 4);

  // Platform below demo player
  ctx.fillStyle = '#e05828';
  ctx.beginPath(); ctx.roundRect(W / 2 - 60, H / 2 + 114, 120, 14, 5); ctx.fill();

  // Press to start
  const a = 0.5 + 0.5 * Math.sin(now / 500);
  ctx.fillStyle = `rgba(40,20,0,${0.4 + a * 0.4})`;
  ctx.font      = 'bold 15px "Space Grotesk", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PRESS SPACE  or  TAP  to start', W / 2, H - 50);
  ctx.textAlign = 'left';

  // Best score
  if (bestScore > 0) {
    ctx.fillStyle = 'rgba(40,20,0,0.4)';
    ctx.font      = '13px "Space Grotesk", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Best: ${bestScore} jumps`, W / 2, H - 24);
    ctx.textAlign = 'left';
  }
}

// ─── Overlay (dead / win) ────────────────────────────────────────────────────
function drawOverlay() {
  if (state !== 'dead' && state !== 'win') return;

  ctx.fillStyle = 'rgba(228,224,214,0.88)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  if (state === 'dead') {
    ctx.fillStyle = '#c82020';
    ctx.font      = 'bold 52px "Space Grotesk", monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 44);

    ctx.fillStyle = '#1a1008';
    ctx.font      = '22px "Space Grotesk", monospace';
    ctx.fillText(`${score} jump${score !== 1 ? 's' : ''} up`, W / 2, H / 2 + 10);

    if (score > 0 && score === bestScore) {
      ctx.fillStyle = '#d09000';
      ctx.font      = 'bold 16px "Space Grotesk", monospace';
      ctx.fillText('★  NEW BEST  ★', W / 2, H / 2 + 46);
    }

    const a = 0.4 + 0.3 * Math.sin(performance.now() / 500);
    ctx.fillStyle = `rgba(40,20,0,${0.4 + a * 0.35})`;
    ctx.font      = '14px "Space Grotesk", monospace';
    ctx.fillText('SPACE / TAP to try again', W / 2, H / 2 + 84);
  }

  if (state === 'win') {
    ctx.fillStyle = '#f1c40f';
    ctx.font      = 'bold 52px "Space Grotesk", monospace';
    ctx.fillText('YOU WIN!', W / 2, H / 2 - 44);

    ctx.fillStyle = 'white';
    ctx.font      = '20px "Space Grotesk", monospace';
    ctx.fillText('100 jumps reached!', W / 2, H / 2 + 8);

    ctx.fillStyle = '#88aaff';
    ctx.font      = '14px "Space Grotesk", monospace';
    ctx.fillText('SPACE / TAP to play again', W / 2, H / 2 + 52);
  }

  ctx.textAlign = 'left';
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(now) {
  update(now);

  if (state === 'intro') {
    drawIntro(now);
    requestAnimationFrame(loop);
    return;
  }

  // Screen shake
  const sx = shakeAmt > 0.5 ? rand(-shakeAmt, shakeAmt) : 0;
  const sy = shakeAmt > 0.5 ? rand(-shakeAmt, shakeAmt) : 0;
  ctx.save();
  if (sx || sy) ctx.translate(sx, sy);

  drawBg();
  drawLogoMural();
  drawBgHolds();
  drawPlatforms();
  drawParticles();
  drawTrajectory();
  drawArrow();
  drawChargeBar();
  drawPlayer();
  drawHUD();
  drawOverlay();

  ctx.restore();
  requestAnimationFrame(loop);
}

// ─── Boot ────────────────────────────────────────────────────────────────────
state = 'intro';
// Pre-build platforms so the intro has something ready
reset();
state = 'intro';
requestAnimationFrame(loop);

// ─── Settings panel ──────────────────────────────────────────────────────────
(function () {
  const DEFAULTS = {
    charge: 800, vx: 3.5, gap: 150, grav: 0.75,
    wbase: 80, wmin: 10, wshrink: 0.75
  };

  const btn   = document.getElementById('cfg-btn');
  const panel = document.getElementById('cfg-panel');

  btn.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.toggle('open');
  });
  // Close panel on tap outside
  document.addEventListener('pointerdown', e => {
    if (!panel.contains(e.target) && e.target !== btn)
      panel.classList.remove('open');
  });

  function bind(id, valId, apply, fmt) {
    const sl  = document.getElementById('sl-' + id);
    const lbl = document.getElementById('v-'  + id);
    sl.addEventListener('input', () => {
      const v = parseFloat(sl.value);
      lbl.textContent = fmt ? fmt(v) : v;
      apply(v);
    });
  }

  document.getElementById('sl-traj').addEventListener('change', e => {
    SHOW_TRAJ = e.target.checked;
  });

  bind('charge',  'charge',  v => { MAX_CHARGE_MS = v; },       v => v);
  bind('vx',      'vx',      v => { MAX_VX        = v; },       v => v.toFixed(1));
  bind('gap',     'gap',     v => { VERT_GAP      = v; },       v => v);
  bind('grav',    'grav',    v => { GRAVITY        = v; },       v => v.toFixed(2));
  bind('wbase',   'wbase',   v => { WIDTH_BASE     = v; },       v => v);
  bind('wmin',    'wmin',    v => { WIDTH_MIN      = v; },       v => v);
  bind('wshrink', 'wshrink', v => { WIDTH_SHRINK   = v; },       v => v.toFixed(2));

  document.getElementById('cfg-reset-btn').addEventListener('click', () => {
    MAX_CHARGE_MS = DEFAULTS.charge;
    MAX_VX        = DEFAULTS.vx;
    VERT_GAP      = DEFAULTS.gap;
    GRAVITY       = DEFAULTS.grav;
    WIDTH_BASE    = DEFAULTS.wbase;
    WIDTH_MIN     = DEFAULTS.wmin;
    WIDTH_SHRINK  = DEFAULTS.wshrink;
    // Sync slider positions
    document.getElementById('sl-charge').value  = DEFAULTS.charge;
    document.getElementById('sl-vx').value      = DEFAULTS.vx;
    document.getElementById('sl-gap').value     = DEFAULTS.gap;
    document.getElementById('sl-grav').value    = DEFAULTS.grav;
    document.getElementById('sl-wbase').value   = DEFAULTS.wbase;
    document.getElementById('sl-wmin').value    = DEFAULTS.wmin;
    document.getElementById('sl-wshrink').value = DEFAULTS.wshrink;
    document.getElementById('v-charge').textContent  = DEFAULTS.charge;
    document.getElementById('v-vx').textContent      = DEFAULTS.vx.toFixed(1);
    document.getElementById('v-gap').textContent     = DEFAULTS.gap;
    document.getElementById('v-grav').textContent    = DEFAULTS.grav.toFixed(2);
    document.getElementById('v-wbase').textContent   = DEFAULTS.wbase;
    document.getElementById('v-wmin').textContent    = DEFAULTS.wmin;
    document.getElementById('v-wshrink').textContent = DEFAULTS.wshrink.toFixed(2);
  });
})();
</script>
